<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Fusebox Power Cube — energized cube with central lightning bolt">
<defs>
 <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63D8E5"/><stop offset=".42" stop-color="#176D85"/><stop offset="1" stop-color="#092831"/></linearGradient>
 <linearGradient id="right" x1=".05" y1="0" x2=".92" y2="1"><stop stop-color="#EA7E36"/><stop offset=".40" stop-color="#8D4119"/><stop offset=".78" stop-color="#365860"/><stop offset="1" stop-color="#8A9A36"/></linearGradient>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D0F3F6"/><stop offset=".36" stop-color="#6E9EAF"/><stop offset=".58" stop-color="#0F4150"/><stop offset=".82" stop-color="#FFB463"/><stop offset="1" stop-color="#C5683B"/></linearGradient>
 <linearGradient id="bolt" x1=".35" y1="0" x2=".65" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".50" stop-color="#FFE0A0"/><stop offset="1" stop-color="#FF842B"/></linearGradient>
 <filter id="softEnergy" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.6"/></filter>
</defs>
<path d="M64 8 L113 35 L113 93 L64 120 L15 93 L15 35 Z" fill="#071F27" stroke="#81CBD6" stroke-width="1.4" stroke-linejoin="round"/>
<!-- Three restrained material faces: capability streams converge at a powered center -->
<path d="M64 8 L113 35 L64 61 L15 35 Z" fill="url(#top)"/>
<path d="M15 35 L64 61 L64 120 L15 93 Z" fill="url(#left)"/>
<path d="M113 35 L64 61 L64 120 L113 93 Z" fill="url(#right)"/>
<!-- Bevel seams and crisp signal edges, also legible without glow -->
<path d="M15 35 L64 61 L113 35 M64 61 V120" fill="none" stroke="#D2F8FB" stroke-opacity=".66" stroke-width="1.5"/>
<path d="M15 35 L64 8 L113 35 L113 93 L64 120 L15 93 Z" fill="none" stroke="#D2F8FB" stroke-width="2" stroke-linejoin="round"/>
<path d="M19 41 V90 L61 114" fill="none" stroke="#75DBE9" stroke-opacity=".6" stroke-width="2"/>
<path d="M108 41 V90 L68 114" fill="none" stroke="#FFAA5A" stroke-opacity=".8" stroke-width="2"/>
<!-- Central controlled spark; glow is presentation-only, never required to perceive the mark -->
<path d="M77 24 L45 70 L62 70 L56 105 L87 55 L70 55 Z" fill="#FF842B" opacity=".62" filter="url(#softEnergy)"/>
<path d="M77 24 L45 70 L62 70 L56 105 L87 55 L70 55 Z" fill="url(#bolt)" stroke="#FFF4D6" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M74 33 L53 65 L68 65 L62 93" fill="none" stroke="#FFFFFF" stroke-opacity=".74" stroke-width="2" stroke-linecap="round"/>
</svg>