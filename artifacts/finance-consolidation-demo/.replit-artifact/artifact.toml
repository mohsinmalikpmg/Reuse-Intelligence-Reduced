kind = "web"
previewPath = "/finance-demo/"
title = "Forecast to Report"
description = "Isolated executable proof connecting reviewed forecasting and management reporting Python source with synthetic data."
version = "1.0.0"
id = "artifacts/finance-consolidation-demo"
router = "path"

[[services]]
name = "web"
paths = [ "/finance-demo/" ]
localPort = 21404

[services.development]
run = "pnpm --filter @workspace/finance-consolidation-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/finance-consolidation-demo", "run", "build" ]
run = ["pnpm", "--filter", "@workspace/finance-consolidation-demo", "run", "serve"]

[services.env]
PORT = "21404"
BASE_PATH = "/finance-demo/"
