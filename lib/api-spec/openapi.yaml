openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Reuse Workbench API - solution discovery, consolidation, simulation and governance
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: personas
  - name: home
  - name: library
  - name: briefs
  - name: cases
  - name: experiments
  - name: portfolio
  - name: demo
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /briefs/{briefId}/code-assessment:
    get:
      operationId: getCodeAssessment
      parameters:
        - { name: briefId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Source-grounded reuse and gap assessment, not proof of integration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeAssessment" }
  /library/code-package:
    get:
      operationId: getLibraryCodePackage
      responses:
        "200":
          description: Immutable demo source package metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryCodePackage" }
  /library/code-packages/{packageId}/download:
    get:
      operationId: downloadLibraryCodePackage
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Signed-in download of stored demo source archive
          content:
            application/zip:
              schema: { type: string, format: binary }
  /intake/records/{id}/compare:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: compareIntakeRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeRevisionInput" }
      responses:
        "200":
          description: Confirmed needs copied to a shared matching brief; private source files excluded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeComparison" }
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the validated returnTo path.
        '400':
          description: Login attempt expired.
        '401':
          description: Login could not be verified.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
    post:
      tags: [Auth]
      operationId: logoutIntakeSession
      summary: Clear the browser session
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
        '403':
          description: Cross-origin logout rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /intake/session:
    get:
      operationId: getIntakeSession
      responses:
        "200":
          description: Signed-in intake user or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeSession"
  /intake/records:
    get:
      operationId: listIntakeRecords
      responses:
        "200":
          description: Current user's intakes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntakeRecord" }
    post:
      operationId: createIntakeRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeRecordInput" }
      responses:
        "201":
          description: Created intake
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeRecord" }
  /intake/records/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getIntakeRecord
      responses:
        "200":
          description: Intake
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeRecord" }
    put:
      operationId: saveIntakeRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeRecordUpdate" }
      responses:
        "200":
          description: Saved with incremented revision; 409 on conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeRecord" }
    delete:
      operationId: deleteIntakeRecord
      responses:
        "204": { description: Deleted }
  /intake/records/{id}/interpret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: interpretIntakeRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeRevisionInput" }
      responses:
        "200":
          description: AI interpreted saved inputs, preserving confirmed unaffected content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeRecord" }
  /intake/records/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: confirmIntakeRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeRevisionInput" }
      responses:
        "200":
          description: Confirmed if all required reviews and gap acknowledgements complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeRecord" }
  /intake/records/{id}/files:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: uploadIntakeFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/IntakeFileInput" }
      responses:
        "201":
          description: Uploaded attachment and extraction result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeAttachment" }
  /intake/files/{fileId}:
    parameters:
      - { name: fileId, in: path, required: true, schema: { type: string } }
    get:
      operationId: downloadIntakeFile
      responses:
        "200":
          description: Original attachment (owner-only)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /personas:
    get:
      operationId: listPersonas
      tags: [personas]
      summary: Seeded login personas
      responses:
        "200":
          description: Personas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Persona"

  /home/seeker:
    get:
      operationId: getSeekerOverview
      tags: [home]
      summary: Solution seeker home
      responses:
        "200":
          description: Seeker overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeekerOverview"

  /home/owner:
    get:
      operationId: getOwnerOverview
      tags: [home]
      summary: Existing solution owner home
      responses:
        "200":
          description: Owner overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerOverview"

  /solutions:
    get:
      operationId: listSolutions
      tags: [library]
      summary: Search the solution library
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SolutionStatus"
      responses:
        "200":
          description: Solutions ordered by maturity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Solution"

  /solutions/{solutionId}/workbench:
    get:
      operationId: getSolutionWorkbench
      tags: [workbench]
      summary: The executable production workflow of a solution, its sample inputs and a saved example run
      parameters:
        - name: solutionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workbench
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolutionWorkbench"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sample-inputs:
    get:
      operationId: listSampleInputs
      tags: [workbench]
      summary: Seeded sample inputs, optionally for one solution
      parameters:
        - name: solutionId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Sample inputs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SampleInput"

  /runs:
    post:
      operationId: runWorkflow
      tags: [workbench]
      summary: Execute one workflow version against an input and persist the result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "201":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /runs/{runId}:
    get:
      operationId: getRun
      tags: [workbench]
      summary: A persisted run
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /library/families:
    get:
      operationId: listSolutionFamilies
      tags: [library]
      summary: The library grouped by business problem - the preferred solution, its approved configurations, reusable capabilities and products being consolidated
      responses:
        "200":
          description: One family per business problem
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SolutionFamily"

  /solutions/{solutionId}/configurations/{version}/preview:
    get:
      operationId: getConfigurationPreview
      tags: [library]
      summary: The same sample input run through the standard configuration and an approved configuration, with the differing lines
      parameters:
        - name: solutionId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Output preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationPreview"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /search:
    get:
      operationId: searchLibrary
      tags: [library]
      summary: Global hybrid search across solutions and capabilities
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SolutionStatus"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SolutionKind"
        - name: owner
          in: query
          required: false
          schema:
            type: string
        - name: businessProblemId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Ranked results with reasons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  /my-solutions:
    get:
      operationId: getMySolutions
      tags: [home]
      summary: The owner's solutions with proposed changes and open tests
      responses:
        "200":
          description: Owned solutions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnedSolution"

  /solutions/{solutionId}:
    get:
      operationId: getSolution
      tags: [library]
      summary: Solution detail with its capabilities
      parameters:
        - name: solutionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Solution detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolutionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /capabilities:
    get:
      operationId: listCapabilities
      tags: [library]
      summary: All reusable capabilities
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capability"

  /business-problems:
    get:
      operationId: listBusinessProblems
      tags: [library]
      summary: Business problems in the portfolio
      responses:
        "200":
          description: Business problems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessProblem"

  /briefs:
    get:
      operationId: listBriefs
      tags: [briefs]
      summary: Recent pain-point briefs
      responses:
        "200":
          description: Briefs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brief"
    post:
      operationId: createBrief
      tags: [briefs]
      summary: Interpret a natural-language pain point into a structured brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefInput"
      responses:
        "201":
          description: Structured brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /briefs/{briefId}:
    get:
      operationId: getBrief
      tags: [briefs]
      summary: Get a brief
      parameters:
        - name: briefId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBrief
      tags: [briefs]
      summary: Confirm or edit the structured interpretation
      parameters:
        - name: briefId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefUpdate"
      responses:
        "200":
          description: Updated brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /briefs/{briefId}/matches:
    get:
      operationId: getBriefMatches
      tags: [briefs]
      summary: Ranked existing solutions that address the brief
      parameters:
        - name: briefId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: Consolidation cases
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CaseStatus"
      responses:
        "200":
          description: Case summaries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseSummary"
    post:
      operationId: createCase
      tags: [cases]
      summary: Start a consolidation case using a solution as the base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseInput"
      responses:
        "201":
          description: Case created with the recommended configuration applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Rename or save a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseUpdate"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/requirements:
    post:
      operationId: addCaseRequirement
      tags: [cases]
      summary: Add a requirement to a case; reports whether Version A covers it and what existing step fits
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseRequirementInput"
      responses:
        "201":
          description: Updated case with the coverage verdict and the reuse check for the new requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseRequirementResult"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cases/{caseId}/requirements/{requirementId}:
    delete:
      operationId: removeCaseRequirement
      tags: [cases]
      summary: Remove a requirement from a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cases/{caseId}/capability-requests:
    post:
      operationId: addCapabilityRequest
      tags: [cases]
      summary: Record a request for a capability that does not exist yet (shown as a non-executing row, never run)
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityRequestInput"
      responses:
        "201":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cases/{caseId}/capability-requests/{requestId}:
    delete:
      operationId: removeCapabilityRequest
      tags: [cases]
      summary: Remove a capability request from a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cases/{caseId}/baseline:
    get:
      operationId: getCaseBaseline
      tags: [workbench]
      summary: Version A of a case - the parent product as it stood at the version the case branched from, with its sample inputs and example run
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Baseline workbench
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolutionWorkbench"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/recommendation:
    get:
      operationId: getCaseRecommendation
      tags: [cases]
      summary: Consolidation recommendation (Overview tab)
      parameters:
        - name: caseId
          in: path
          required: true
