openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Reuse Workbench API - solution discovery, consolidation, simulation and governance
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: personas
  - name: home
  - name: library
  - name: briefs
  - name: cases
  - name: experiments
  - name: portfolio
  - name: demo
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /personas:
    get:
      operationId: listPersonas
      tags: [personas]
      summary: Seeded login personas
      responses:
        "200":
          description: Personas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Persona"

  /home/seeker:
    get:
      operationId: getSeekerOverview
      tags: [home]
      summary: Solution seeker home
      responses:
        "200":
          description: Seeker overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeekerOverview"

  /home/owner:
    get:
      operationId: getOwnerOverview
      tags: [home]
      summary: Existing solution owner home
      responses:
        "200":
          description: Owner overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerOverview"

  /solutions:
    get:
      operationId: listSolutions
      tags: [library]
      summary: Search the solution library
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SolutionStatus"
      responses:
        "200":
          description: Solutions ordered by maturity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Solution"

  /solutions/{solutionId}/workbench:
    get:
      operationId: getSolutionWorkbench
      tags: [workbench]
      summary: The executable production workflow of a solution, its sample inputs and a saved example run
      parameters:
        - name: solutionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workbench
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolutionWorkbench"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sample-inputs:
    get:
      operationId: listSampleInputs
      tags: [workbench]
      summary: Seeded sample inputs, optionally for one solution
      parameters:
        - name: solutionId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Sample inputs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SampleInput"

  /runs:
    post:
      operationId: runWorkflow
      tags: [workbench]
      summary: Execute one workflow version against an input and persist the result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "201":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /runs/{runId}:
    get:
      operationId: getRun
      tags: [workbench]
      summary: A persisted run
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /search:
    get:
      operationId: searchLibrary
      tags: [library]
      summary: Global hybrid search across solutions and capabilities
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SolutionStatus"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SolutionKind"
        - name: owner
          in: query
          required: false
          schema:
            type: string
        - name: businessProblemId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Ranked results with reasons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  /my-solutions:
    get:
      operationId: getMySolutions
      tags: [home]
      summary: The owner's solutions with proposed changes and open tests
      responses:
        "200":
          description: Owned solutions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnedSolution"

  /solutions/{solutionId}:
    get:
      operationId: getSolution
      tags: [library]
      summary: Solution detail with its capabilities
      parameters:
        - name: solutionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Solution detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolutionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /capabilities:
    get:
      operationId: listCapabilities
      tags: [library]
      summary: All reusable capabilities
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capability"

  /business-problems:
    get:
      operationId: listBusinessProblems
      tags: [library]
      summary: Business problems in the portfolio
      responses:
        "200":
          description: Business problems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessProblem"

  /briefs:
    get:
      operationId: listBriefs
      tags: [briefs]
      summary: Recent pain-point briefs
      responses:
        "200":
          description: Briefs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brief"
    post:
      operationId: createBrief
      tags: [briefs]
      summary: Interpret a natural-language pain point into a structured brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefInput"
      responses:
        "201":
          description: Structured brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /briefs/{briefId}:
    get:
      operationId: getBrief
      tags: [briefs]
      summary: Get a brief
      parameters:
        - name: briefId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBrief
      tags: [briefs]
      summary: Confirm or edit the structured interpretation
      parameters:
        - name: briefId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefUpdate"
      responses:
        "200":
          description: Updated brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /briefs/{briefId}/matches:
    get:
      operationId: getBriefMatches
      tags: [briefs]
      summary: Ranked existing solutions that address the brief
      parameters:
        - name: briefId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: Consolidation cases
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CaseStatus"
      responses:
        "200":
          description: Case summaries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseSummary"
    post:
      operationId: createCase
      tags: [cases]
      summary: Start a consolidation case using a solution as the base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseInput"
      responses:
        "201":
          description: Case created with the recommended configuration applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Rename or save a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseUpdate"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/requirements:
    post:
      operationId: addCaseRequirement
      tags: [cases]
      summary: Add a requirement to a case; reports whether Version A covers it and what existing step fits
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseRequirementInput"
      responses:
        "201":
          description: Updated case with the coverage verdict and the reuse check for the new requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseRequirementResult"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cases/{caseId}/requirements/{requirementId}:
    delete:
      operationId: removeCaseRequirement
      tags: [cases]
      summary: Remove a requirement from a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cases/{caseId}/capability-requests:
    post:
      operationId: addCapabilityRequest
      tags: [cases]
      summary: Record a request for a capability that does not exist yet (shown as a non-executing row, never run)
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityRequestInput"
      responses:
        "201":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cases/{caseId}/capability-requests/{requestId}:
    delete:
      operationId: removeCapabilityRequest
      tags: [cases]
      summary: Remove a capability request from a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cases/{caseId}/recommendation:
    get:
      operationId: getCaseRecommendation
      tags: [cases]
      summary: Consolidation recommendation (Overview tab)
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/compare:
    get:
      operationId: getCaseComparison
      tags: [workbench]
      summary: Latest A/B comparison per input for this case, newest first
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest comparison for each input that has been run
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ABComparison"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: runCaseComparison
      tags: [workbench]
      summary: Run Version A (current product) and Version B (proposed) on the same input
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareRequest"
      responses:
        "200":
          description: Both runs, their diff and defensible measures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ABComparison"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/evaluations:
    get:
      operationId: listCaseEvaluations
      tags: [workbench]
      summary: Recorded human preferences for this case with a summary computed only from them
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evaluations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationList"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: recordEvaluation
      tags: [workbench]
      summary: Record which output better solves the problem
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationList"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/test-sessions:
    get:
      operationId: listTestSessions
      tags: [workbench]
      summary: Blind test sessions for this case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestSession"
    post:
      operationId: createTestSession
      tags: [workbench]
      summary: Create a blind test session from the latest comparisons (owner)
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestSessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSession"
        "400":
          description: Nothing to test yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /test-sessions/{sessionId}:
    get:
      operationId: getTestSession
      tags: [workbench]
      summary: A blind session with its unlabelled output pairs
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /test-sessions/{sessionId}/responses:
    post:
      operationId: respondToTestSession
      tags: [workbench]
      summary: Record a blind tester's choice for one pair
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestResponseInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSession"
        "400":
          description: Invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/configuration:
    get:
      operationId: getCaseConfiguration
      tags: [cases]
      summary: Governed workflow configuration with impact (Configure tab)
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuration"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCaseConfiguration
      tags: [cases]
      summary: Toggle optional modules or set configurable values
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigurationUpdate"
      responses:
        "200":
          description: Updated configuration with recalculated impact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuration"
        "400":
          description: Change not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/experiment-plan:
    get:
      operationId: getCaseExperimentPlan
      tags: [experiments]
      summary: Auto-generated experiment design (Test tab, before running)
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Experiment plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentPlan"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/experiments:
    post:
      operationId: runCaseExperiment
      tags: [experiments]
      summary: Run the seeded synthetic-user simulation (baseline vs proposed)
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Completed simulated experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/review:
    get:
      operationId: getCaseReview
      tags: [cases]
      summary: Before-and-after change review with pilot plan and decisions
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Change review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeReview"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/consolidation:
    get:
      operationId: getCaseConsolidation
      tags: [cases]
      summary: Current-state to future-state consolidation summary for the Decide view
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Consolidation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsolidationDecisionView"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/similar:
    get:
      operationId: getSimilarExperiments
      tags: [cases]
      summary: Other active experiments on the same parent with a similar intent or change
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Similar experiments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarExperiments"
        "404":
          description: Case not found

  /my-solutions/{solutionId}/groups/{groupKey}:
    get:
      operationId: getImprovementGroup
      tags: [home]
      summary: Grouped evidence for one shared improvement on an owned product
      parameters:
        - name: solutionId
          in: path
          required: true
          schema:
            type: string
        - name: groupKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Improvement group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImprovementGroupDetail"
        "404":
          description: Group not found

  /my-solutions/{solutionId}/groups/{groupKey}/decisions:
    post:
      operationId: recordGroupDecision
      tags: [home]
      summary: Record one owner decision across every experiment in the group
      parameters:
        - name: solutionId
          in: path
          required: true
          schema:
            type: string
        - name: groupKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupDecisionInput"
      responses:
        "201":
          description: Updated group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImprovementGroupDetail"
        "400":
          description: Decision not allowed
        "404":
          description: Group not found

  /cases/{caseId}/decisions:
    post:
      operationId: recordCaseDecision
      tags: [cases]
      summary: Record an owner or IT decision on the case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "201":
          description: Updated case after the decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Decision not allowed for this role or state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /experiments:
    get:
      operationId: listExperiments
      tags: [experiments]
      summary: All simulated experiments, newest first
      responses:
        "200":
          description: Experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experiment"

  /experiments/{experimentId}:
    get:
      operationId: getExperiment
      tags: [experiments]
      summary: Get an experiment
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolio:
    get:
      operationId: getPortfolio
      tags: [portfolio]
      summary: IT portfolio decision dashboard
      responses:
        "200":
          description: Portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"

  /portfolio/decision-queue:
    get:
      operationId: getDecisionQueue
      tags: [portfolio]
      summary: Cases awaiting an IT decision
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseSummary"

  /reuse-check:
    post:
      operationId: reuseCheck
      tags: [reuse]
      summary: Score existing capabilities, configurations and experiments against a plain-language need
      description: Deterministic reuse-fit scoring with the published weights and hard exclusions. Records a reuse event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReuseCheckInput"
      responses:
        "200":
          description: At most three options with scores, paths and reasons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReuseCheckResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reuse-events:
    get:
      operationId: listReuseEvents
      tags: [reuse]
      summary: Reuse-check events, newest first
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReuseEvent"

  /reuse-events/{eventId}:
    patch:
      operationId: updateReuseEvent
      tags: [reuse]
      summary: Record which path the user took on a reuse check
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReuseEventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReuseEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /demo/reset:
    post:
      operationId: resetDemo
      tags: [demo]
      summary: One-click reset to the pre-seeded demonstration scenario
      responses:
        "200":
          description: Reset complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoState"

  /demo/state:
    get:
      operationId: getDemoState
      tags: [demo]
      summary: Identifiers of the preloaded demonstration case
      responses:
        "200":
          description: Demo state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoState"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Role:
      type: string
      enum: [seeker, owner, it]

    SolutionStatus:
      type: string
      enum: [certified, pilot, experimental, deprecated]

    SolutionKind:
      type: string
      enum: [complete_solution, configurable_product, capability_module, prototype]

    EvidenceLevel:
      type: string
      enum: [strong, moderate, limited, none]

    EffortLevel:
      type: string
      enum: [low, medium, high]

    ControlType:
      type: string
      enum: [locked, configurable, optional]

    FeatureState:
      type: string
      enum: [required, configurable, optional, incompatible, recommended, retiring]

    CaseStatus:
      type: string
      enum: [draft, tested, pilot_proposed, approved, changes_requested, deferred, rejected]

    DecisionAction:
      type: string
      description: >-
        propose_pilot = propose the improvement to the parent product (pilot exposure is a detail of that proposal);
        propose_capability = propose an added capability as reusable; request_new_family = ask for a new solution family (reason required);
        adopt_approach, merge_approaches, request_more_evidence, keep_local, decline = grouped owner decisions on a shared improvement.
      enum: [propose_pilot, propose_capability, request_new_family, approve_pilot, request_changes, defer, reject, approve_consolidation, adopt_approach, merge_approaches, request_more_evidence, keep_local, decline]

    PromotionState:
      type: string
      description: Where the experiment stands relative to its parent product; it never becomes a product on its own
      enum: [experiment, proposed_to_parent, proposed_capability, new_family_requested]

    CaseLineage:
      type: object
      description: The exact difference between this experiment and its parent version, derived from the configuration fingerprint
      required: [parentSolutionId, parentSolutionName, parentVersion, fingerprint, added, removed, changedSettings, intent, intentKey, summary]
      properties:
        parentSolutionId: { type: string }
        parentSolutionName: { type: string }
        parentVersion: { type: string }
        fingerprint: { type: string, description: Fingerprint of the experiment's current configuration }
        added:
          type: array
          description: Capability names switched on that the parent version does not run
          items: { type: string }
        removed:
          type: array
          description: Parent capabilities switched off in the experiment
          items: { type: string }
        changedSettings:
          type: array
          items: { $ref: "#/components/schemas/ConfigChange" }
        intent: { type: string, description: The requirement or added capability that defines the experiment }
        intentKey: { type: string, description: Stable key used to group experiments with the same intent }
        summary: { type: string, description: One line, e.g. "Adds Safety Signals · 1 setting changed" }

    SimilarExperiment:
      type: object
      required: [case, sameApproach, changes, votes, inputsTested]
      properties:
        case: { $ref: "#/components/schemas/Case" }
        sameApproach: { type: boolean, description: True when the other experiment's current configuration is identical }
        changes:
          type: array
          items: { type: string }
        votes:
          oneOf:
            - $ref: "#/components/schemas/EvaluationSummary"
            - type: "null"
          description: Preference votes on that experiment's current configuration only
        inputsTested: { type: integer }

    SimilarExperiments:
      type: object
      required: [count, teams, experiments]
      properties:
        count: { type: integer }
        teams: { type: integer, description: Distinct teams behind the similar experiments }
        experiments:
          type: array
          items: { $ref: "#/components/schemas/SimilarExperiment" }

    ImprovementGroup:
      type: object
      description: Experiments on one parent product that share an intent, with counts from current-configuration evidence only
      required: [key, solutionId, intent, experiments, teams, completedTests, preferredModifiedPercent, approaches, pendingReview]
      properties:
        key: { type: string }
        solutionId: { type: string }
        intent: { type: string }
        experiments:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        teams: { type: integer }
        completedTests: { type: integer, description: Recorded votes on the current configuration of each experiment }
        preferredModifiedPercent:
          type: ["number", "null"]
          description: Share of those votes that preferred the modified output; null when there are none
        approaches: { type: integer, description: Distinct current configurations across the experiments }
        pendingReview: { type: boolean, description: At least one experiment is proposed and awaiting the owner }

    ImprovementApproach:
      type: object
      required: [fingerprint, label, changes, experiments, teams, votes, inputsTested]
      properties:
        fingerprint: { type: string }
        label: { type: string }
        changes:
          type: array
          items: { type: string }
        experiments:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        teams:
          type: array
          items: { type: string }
        votes:
          oneOf:
            - $ref: "#/components/schemas/EvaluationSummary"
            - type: "null"
        inputsTested: { type: integer }

    ImprovementGroupDetail:
      type: object
      required: [group, solution, approaches, decisions, availableActions]
      properties:
        group: { $ref: "#/components/schemas/ImprovementGroup" }
        solution: { $ref: "#/components/schemas/Solution" }
        approaches:
          type: array
          items: { $ref: "#/components/schemas/ImprovementApproach" }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/Decision" }
        availableActions:
          type: array
          items: { $ref: "#/components/schemas/DecisionAction" }

    GroupDecisionInput:
      type: object
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/DecisionAction" }
        caseId: { type: string, description: The experiment adopted; required for adopt_approach }
        reason: { type: string }

    ExperimentRecommendation:
      type: string
      enum: [proceed_to_pilot, revise_configuration, gather_more_evidence, do_not_proceed]

    Persona:
      type: object
      required: [id, role, name, title, team, headline]
      properties:
        id: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        name: { type: string }
        title: { type: string }
        team: { type: string }
        headline: { type: string }

    Metrics:
      type: object
      description: Operating metrics for one task on one solution version
      required: [taskMinutes, successRate, effortScore, errorRate, adoption, costPerTask]
      properties:
        taskMinutes: { type: number, description: Average minutes to complete the task }
        successRate: { type: number, description: 0-100 percent }
        effortScore: { type: number, description: 1 (low) to 10 (high) user effort }
        errorRate: { type: number, description: 0-100 percent exceptions }
        adoption: { type: number, description: 0-100 percent expected adoption }
        costPerTask: { type: number, description: Currency per task }

    SolutionVersion:
      type: object
      required: [version, releasedAt, summary]
      properties:
        version: { type: string }
        releasedAt: { type: string }
        summary: { type: string }

    Solution:
      type: object
      required:
        - id
        - name
        - outcome
        - description
        - status
        - kind
        - ownerName
        - ownerTeam
        - businessUnits
        - activeUsers
        - evidenceLevel
        - timeToAdopt
        - adoptionEffort
        - workflowSteps
        - currentVersion
        - versions
        - knownGaps
        - dependencies
        - capabilityIds
        - businessProblemIds
        - baselineMetrics
        - retirementCandidate
        - architectureStatus
        - controlStatus
        - supportModel
        - lastReviewedAt
      properties:
        id: { type: string }
        name: { type: string }
        outcome: { type: string, description: One-sentence outcome }
        description: { type: string }
        status: { $ref: "#/components/schemas/SolutionStatus" }
        kind: { $ref: "#/components/schemas/SolutionKind" }
        ownerName: { type: string }
        ownerTeam: { type: string }
        businessUnits:
          type: array
          items: { type: string }
        activeUsers: { type: integer }
        evidenceLevel: { $ref: "#/components/schemas/EvidenceLevel" }
        timeToAdopt: { type: string }
        adoptionEffort: { $ref: "#/components/schemas/EffortLevel" }
        workflowSteps:
          type: array
          items: { type: string }
        currentVersion: { type: string }
        versions:
          type: array
          items: { $ref: "#/components/schemas/SolutionVersion" }
        knownGaps:
          type: array
          items: { type: string }
        dependencies:
          type: array
          items: { type: string }
        capabilityIds:
          type: array
          items: { type: string }
        businessProblemIds:
          type: array
          items: { type: string }
        baselineMetrics: { $ref: "#/components/schemas/Metrics" }
        retirementCandidate: { type: boolean }
        architectureStatus: { type: string }
        controlStatus: { type: string }
        supportModel: { type: string }
        lastReviewedAt: { type: string }

    Capability:
      type: object
      required:
        - id
        - name
        - description
        - category
        - sourceSolutionId
        - sourceSolutionName
        - ownerName
        - controlType
        - workflowStep
        - riskClass
        - evidenceLevel
        - lockedReason
        - options
        - defaultOption
        - effects
        - incompatibleWith
        - dependsOn
        - testCoverage
        - supportStatus
        - version
        - evidence
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        sourceSolutionId: { type: string }
        sourceSolutionName: { type: string }
        ownerName: { type: string }
        controlType: { $ref: "#/components/schemas/ControlType" }
        workflowStep: { type: string }
        riskClass: { $ref: "#/components/schemas/EffortLevel" }
        evidenceLevel: { $ref: "#/components/schemas/EvidenceLevel" }
        lockedReason: { type: ["string", "null"] }
        options:
          type: ["array", "null"]
          items: { type: string }
        defaultOption: { type: ["string", "null"] }
        effects:
          $ref: "#/components/schemas/Metrics"
          description: Expected deltas applied when the capability is active
        incompatibleWith:
          type: array
          items: { type: string }
        dependsOn:
          type: array
          items: { type: string }
        testCoverage: { type: string }
        supportStatus: { type: string }
        version: { type: string }
        evidence: { type: string }

    SolutionDetail:
      type: object
      required: [solution, capabilities, businessProblems, openCases, experimentsInProgress]
      properties:
        solution: { $ref: "#/components/schemas/Solution" }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
        businessProblems:
          type: array
          items: { $ref: "#/components/schemas/BusinessProblem" }
        openCases:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        experimentsInProgress:
          type: array
          description: Saved or proposed experiments branched from this product; never library entries
          items: { $ref: "#/components/schemas/CaseSummary" }

    BusinessProblem:
      type: object
      required: [id, title, description, activeSolutionIds, recommendedAction, status]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        activeSolutionIds:
          type: array
          items: { type: string }
        recommendedAction:
          type: string
          enum: [consolidate, standardize, retain, retire]
        status: { type: string }

    BriefField:
      type: object
      required: [value, confidence]
      properties:
        value: { type: string }
        confidence: { type: number, description: 0-1 }

    BriefFields:
      type: object
      required:
        - user
        - job
        - currentProcess
        - painPoint
        - desiredOutcome
        - constraints
        - data
        - requiredControls
        - successMeasures
      properties:
        user: { $ref: "#/components/schemas/BriefField" }
        job: { $ref: "#/components/schemas/BriefField" }
        currentProcess: { $ref: "#/components/schemas/BriefField" }
        painPoint: { $ref: "#/components/schemas/BriefField" }
        desiredOutcome: { $ref: "#/components/schemas/BriefField" }
        constraints: { $ref: "#/components/schemas/BriefField" }
        data: { $ref: "#/components/schemas/BriefField" }
        requiredControls: { $ref: "#/components/schemas/BriefField" }
        successMeasures: { $ref: "#/components/schemas/BriefField" }

    Brief:
      type: object
      required:
        - id
        - rawText
        - fields
        - clarifyingQuestion
        - clarification
        - source
        - valueStatement
        - today
        - better
        - requirements
        - confirmed
        - createdAt
      properties:
        id: { type: string }
        rawText: { type: string }
        today: { type: string, description: What is happening now, one sentence, editable }
        better: { type: string, description: The outcome the user wants, one sentence, editable }
        requirements:
          type: array
          description: Short requirements derived from "Better" plus any the user added; editable
          items: { $ref: "#/components/schemas/BriefRequirement" }
        fields: { $ref: "#/components/schemas/BriefFields" }
        clarifyingQuestion:
          type: ["string", "null"]
          description: At most one clarifying question, only when necessary
        clarification: { type: ["string", "null"] }
        source:
          type: string
          enum: [ai, cached, fallback]
          description: ai = live model, cached = demo prompt cache, fallback = deterministic rules
        valueStatement:
          type: string
          description: Immediate value statement, e.g. how many existing products address the need
        confirmed: { type: boolean }
        createdAt: { type: string }

    BriefInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 10 }

    BriefFieldValues:
      type: object
      properties:
        user: { type: string }
        job: { type: string }
        currentProcess: { type: string }
        painPoint: { type: string }
        desiredOutcome: { type: string }
        constraints: { type: string }
        data: { type: string }
        requiredControls: { type: string }
        successMeasures: { type: string }

    BriefUpdate:
      type: object
      properties:
        fields: { $ref: "#/components/schemas/BriefFieldValues" }
        today: { type: string }
        better: { type: string }
        requirements:
          type: array
          description: Full replacement of the requirements list
          items: { $ref: "#/components/schemas/BriefRequirementInput" }
        confirmed: { type: boolean }
        clarification: { type: string }

    FitLabel:
      type: string
      enum: [strong, good, partial, weak]

    MatchScoring:
      type: object
      required: [semantic, workflow, persona, readiness, evidence, integration]
      properties:
        semantic: { type: number }
        workflow: { type: number }
        persona: { type: number }
        readiness: { type: number }
        evidence: { type: number }
        integration: { type: number }

    SolutionMatch:
      type: object
      required: [rank, solution, fitScore, fitLabel, recommended, whyMatched, gaps, scoring]
      properties:
        rank: { type: integer }
        solution: { $ref: "#/components/schemas/Solution" }
        fitScore: { type: number, description: 0-100 }
        fitLabel: { $ref: "#/components/schemas/FitLabel" }
        recommended: { type: boolean }
        whyMatched:
          type: array
          items: { type: string }
        gaps:
          type: array
          items: { type: string }
        scoring: { $ref: "#/components/schemas/MatchScoring" }

    CapabilityMatch:
      type: object
      required: [capability, fitScore, whyMatched]
      properties:
        capability: { $ref: "#/components/schemas/Capability" }
        fitScore: { type: number }
        whyMatched:
          type: array
          items: { type: string }

    MatchResult:
      type: object
      required: [briefId, headline, matches, capabilityMatches, missingRequirements, coverage, existingCaseId]
      properties:
        briefId: { type: string }
        headline: { type: string }
        matches:
          type: array
          items: { $ref: "#/components/schemas/SolutionMatch" }
        capabilityMatches:
          type: array
          items: { $ref: "#/components/schemas/CapabilityMatch" }
        missingRequirements:
          type: array
          items: { type: string }
        coverage:
          type: array
          description: One row per brief requirement, measured against the recommended solution
          items: { $ref: "#/components/schemas/RequirementCoverage" }
        existingCaseId:
          type: ["string", "null"]
          description: Case already started from this brief, if any

    BriefRequirement:
      type: object
      required: [id, text, source]
      properties:
        id: { type: string }
        text: { type: string }
        source:
          type: string
          enum: [derived, added]
          description: derived = read from the brief's "Better" statement; added = typed by the user

    BriefRequirementInput:
      type: object
      required: [text]
      properties:
        id: { type: string }
        text: { type: string, minLength: 3 }
        source:
          type: string
          enum: [derived, added]

    CoverageStatus:
      type: string
      enum: [covered, covered_reusable, uncovered]
      description: covered = the recommended solution has it; covered_reusable = a module from a sibling product has it; uncovered = nothing in the product family

    RequirementCoverage:
      type: object
      required: [requirementId, text, status, coveredBy, capabilityId, capabilityName, score]
      properties:
        requirementId: { type: string }
        text: { type: string }
        status: { $ref: "#/components/schemas/CoverageStatus" }
        coveredBy:
          type: ["string", "null"]
          description: Name of the product that covers the requirement
        capabilityId: { type: ["string", "null"] }
        capabilityName: { type: ["string", "null"] }
        score:
          type: ["number", "null"]
          description: Reuse-fit score of the covering capability (0-100)

    ReuseTrigger:
      type: string
      enum: [discover_requirement, add_step, add_requirement, save, search, seed]

    ReusePath:
      type: string
      enum: [try_existing, improve_existing, new_experiment, hard_exclusion]
      description: try_existing >= 80, improve_existing 60-79, new_experiment < 60, hard_exclusion when a rule disqualifies the option

    ReusePathTaken:
      type: string
      enum: [use, improve, create, dismissed]

    ReuseOptionKind:
      type: string
      enum: [capability, configuration, experiment, create]

    ReuseFitDimensions:
      type: object
      description: Each dimension is 0-100; the weights are problem fit 30, input/output 20, workflow position 15, user context 10, data/control 15, maturity/evidence 10
      required: [problemFit, inputOutput, workflowPosition, userContext, dataControl, maturityEvidence]
      properties:
        problemFit: { type: number }
        inputOutput: { type: number }
        workflowPosition: { type: number }
        userContext: { type: number }
        dataControl: { type: number }
        maturityEvidence: { type: number }

    ReuseOption:
      type: object
      required: [kind, title, subtitle, score, path, reasons, exclusions, dimensions, capability, solutionId, solutionName, caseId, addableTo]
      properties:
        kind: { $ref: "#/components/schemas/ReuseOptionKind" }
        title: { type: string }
        subtitle: { type: string }
        score:
          type: ["number", "null"]
          description: 0-100 reuse-fit score; null for the create option
        path: { $ref: "#/components/schemas/ReusePath" }
        reasons:
          type: array
          items: { type: string }
        exclusions:
          type: array
          description: Hard-exclusion rules that fired, in plain language
          items: { type: string }
        dimensions:
          oneOf:
            - $ref: "#/components/schemas/ReuseFitDimensions"
            - type: "null"
        capability:
          oneOf:
            - $ref: "#/components/schemas/Capability"
            - type: "null"
        solutionId: { type: ["string", "null"] }
        solutionName: { type: ["string", "null"] }
        caseId:
          type: ["string", "null"]
          description: Set when the option is an active experiment
        addableTo:
          type: ["string", "null"]
          description: Base solution id the capability can be added to in the workbench, when the context allows it

    ReuseCheckInput:
      type: object
      required: [need, trigger]
      properties:
        need: { type: string, minLength: 3 }
        trigger: { $ref: "#/components/schemas/ReuseTrigger" }
        baseSolutionId: { type: string }
        caseId: { type: string }
        briefId: { type: string }
        requirementId: { type: string }
        workflowStep: { type: string }

    ReuseCheckResult:
      type: object
      required: [eventId, need, options, best, recommendedPath, surfaced]
      properties:
        eventId: { type: string }
        need: { type: string }
        options:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ReuseOption" }
        best:
          oneOf:
            - $ref: "#/components/schemas/ReuseOption"
            - type: "null"
        recommendedPath: { $ref: "#/components/schemas/ReusePath" }
        surfaced:
          type: boolean
          description: True when a credible existing option (score >= 60) exists and should be shown

    ReuseEvent:
      type: object
      required: [id, trigger, need, baseSolutionId, caseId, briefId, bestScore, bestTitle, bestSolutionId, bestCapabilityId, pathRecommended, pathTaken, actor, demo, createdAt]
      properties:
        id: { type: string }
        trigger: { $ref: "#/components/schemas/ReuseTrigger" }
        need: { type: string }
        baseSolutionId: { type: ["string", "null"] }
        caseId: { type: ["string", "null"] }
        briefId: { type: ["string", "null"] }
        bestScore: { type: ["number", "null"] }
        bestTitle: { type: ["string", "null"] }
        bestSolutionId: { type: ["string", "null"] }
        bestCapabilityId: { type: ["string", "null"] }
        pathRecommended: { $ref: "#/components/schemas/ReusePath" }
        pathTaken:
          oneOf:
            - $ref: "#/components/schemas/ReusePathTaken"
            - type: "null"
        actor: { type: string }
        demo: { type: boolean, description: Seeded demonstration data, not a real user action }
        createdAt: { type: string }

    ReuseEventUpdate:
      type: object
      required: [pathTaken]
      properties:
        pathTaken: { $ref: "#/components/schemas/ReusePathTaken" }

    Case:
      type: object
      required:
        - id
        - briefId
        - title
        - businessProblemId
        - baseSolutionId
        - candidateSolutionIds
        - status
        - moduleStates
        - configValues
        - experimentId
        - pilotPercent
        - createdByRole
        - saved
        - requirements
        - capabilityRequests
        - parentVersion
        - intent
        - ownerName
        - ownerTeam
        - promotionState
        - demo
        - lineage
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        briefId: { type: ["string", "null"] }
        title: { type: string }
        businessProblemId: { type: string }
        baseSolutionId: { type: string, description: The parent product this experiment branches from }
        parentVersion: { type: string, description: Parent product version the experiment branched from }
        intent: { type: ["string", "null"], description: Intent set by the person; null when derived from the change }
        ownerName: { type: string, description: Person who owns this experiment }
        ownerTeam: { type: string }
        promotionState: { $ref: "#/components/schemas/PromotionState" }
        demo: { type: boolean, description: Seeded demo experiment from another persona }
        lineage: { $ref: "#/components/schemas/CaseLineage" }
        candidateSolutionIds:
          type: array
          items: { type: string }
        status: { $ref: "#/components/schemas/CaseStatus" }
        moduleStates:
          type: object
          description: Optional module id -> active
          additionalProperties: { type: boolean }
        configValues:
          type: object
          description: Configurable capability id -> selected option
          additionalProperties: { type: string }
        experimentId: { type: ["string", "null"] }
        pilotPercent: { type: integer, description: Pilot exposure chosen for this case (5, 10 or 20) }
        createdByRole: { $ref: "#/components/schemas/Role" }
        saved: { type: boolean }
        requirements:
          type: array
          description: Requirements added while testing, on top of the brief's list
          items: { $ref: "#/components/schemas/CaseRequirement" }
        capabilityRequests:
          type: array
          description: Capabilities the person asked for that do not exist yet; recorded, never run
          items: { $ref: "#/components/schemas/CapabilityRequest" }
        createdAt: { type: string }
        updatedAt: { type: string }

    CaseRequirement:
      type: object
      required: [id, text, createdAt]
      properties:
        id: { type: string }
        text: { type: string }
        createdAt: { type: string }

    CaseRequirementInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 3 }

    CaseRequirementCoverage:
      type: object
      description: Whether Version A (the current product) already does what the requirement asks
      required: [covered, capabilityId, capabilityName, score]
      properties:
        covered: { type: boolean }
        capabilityId: { type: ["string", "null"] }
        capabilityName: { type: ["string", "null"] }
        score: { type: ["number", "null"] }

    CaseRequirementResult:
      type: object
      required: [case, requirement, coverage, check]
      properties:
        case: { $ref: "#/components/schemas/Case" }
        requirement: { $ref: "#/components/schemas/CaseRequirement" }
        coverage: { $ref: "#/components/schemas/CaseRequirementCoverage" }
        check: { $ref: "#/components/schemas/ReuseCheckResult" }

    CapabilityRequest:
      type: object
      required: [id, need, missing, afterStepId, reuseEventId, createdAt]
      properties:
        id: { type: string }
        need: { type: string, description: What should happen, in the person's words }
        missing: { type: string, description: What the existing approach does not do }
        afterStepId:
          type: ["string", "null"]
          description: Capability id of the step the request was placed after; null for the end of the workflow
        reuseEventId: { type: ["string", "null"] }
        createdAt: { type: string }

    CapabilityRequestInput:
      type: object
      required: [need, missing]
      properties:
        need: { type: string, minLength: 3 }
        missing: { type: string, minLength: 3 }
        afterStepId: { type: string }
        reuseEventId: { type: string }

    CaseInput:
      type: object
      required: [baseSolutionId]
      properties:
        baseSolutionId: { type: string }
        briefId: { type: string }
        title: { type: string }
        intent: { type: string }
        createdByRole: { $ref: "#/components/schemas/Role" }
        moduleIds:
          type: array
          description: Addable modules switched on in Version B from the start (e.g. from a reuse check)
          items: { type: string }
        reuseEventId:
          type: string
          description: Reuse-check event this case acts on; recorded as the path taken

    CaseUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        intent: { type: string, minLength: 1 }
        saved: { type: boolean }
        pilotPercent: { type: integer, enum: [5, 10, 20] }

    ConsolidationSolution:
      type: object
      required: [solution, fate, note]
      properties:
        solution: { $ref: "#/components/schemas/Solution" }
        fate:
          type: string
          enum: [base, folded, retired]
        note: { type: string, description: One sentence on what happens to this product }

    FutureProduct:
      type: object
      required: [name, core, modules, controls]
      properties:
        name: { type: string }
        core: { type: string, description: One line describing the certified core workflow }
        modules:
          type: array
          description: Optional modules carried into the future product
          items:
            type: object
            required: [name, sourceSolutionName]
            properties:
              name: { type: string }
              sourceSolutionName: { type: string }
        controls:
          type: array
          description: Locked controls that stay in place
          items: { type: string }

    ConsolidationDecisionView:
      type: object
      required:
        - caseId
        - headline
        - current
        - future
        - outcomes
        - risk
        - evidence
        - availableActions
        - decided
      properties:
        caseId: { type: string }
        headline: { type: string, description: e.g. Three solutions can become one governed product. }
        current:
          type: array
          items: { $ref: "#/components/schemas/ConsolidationSolution" }
        future: { $ref: "#/components/schemas/FutureProduct" }
        outcomes:
          type: array
          description: At most four plain-language outcomes
          items: { type: string }
        risk: { type: string, description: The single most important risk }
        evidence:
          type: array
          description: Supporting evidence for the detail drawer
          items: { type: string }
        availableActions:
          type: array
          description: Decision actions currently permitted per role
          items:
            type: object
            required: [role, actions]
            properties:
              role: { $ref: "#/components/schemas/Role" }
              actions:
                type: array
                items: { $ref: "#/components/schemas/DecisionAction" }
        decided:
          type: ["string", "null"]
          description: Summary of the IT consolidation decision, if one exists

    Decision:
      type: object
      required: [id, caseId, role, actor, action, reason, createdAt]
      properties:
        id: { type: string }
        caseId: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        actor: { type: string }
        action: { $ref: "#/components/schemas/DecisionAction" }
        reason: { type: ["string", "null"] }
        createdAt: { type: string }

    DecisionInput:
      type: object
      required: [role, action]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        action: { $ref: "#/components/schemas/DecisionAction" }
        reason: { type: string }

    CaseSummary:
      type: object
      required:
        - case
        - baseSolution
        - businessProblemTitle
        - addedCapabilities
        - experimentRecommendation
        - latestDecision
        - nextStep
      properties:
        case: { $ref: "#/components/schemas/Case" }
        baseSolution: { $ref: "#/components/schemas/Solution" }
        businessProblemTitle: { type: string }
        addedCapabilities:
          type: array
          items: { type: string }
        experimentRecommendation:
          oneOf:
            - $ref: "#/components/schemas/ExperimentRecommendation"
            - type: "null"
        latestDecision:
          oneOf:
            - $ref: "#/components/schemas/Decision"
            - type: "null"
        nextStep: { type: string, description: Plain-language next action for the current state }

    CapabilityProvenance:
      type: object
      required: [capability, sourceSolutionName, reason, evidence, state]
      properties:
        capability: { $ref: "#/components/schemas/Capability" }
        sourceSolutionName: { type: string }
        reason: { type: string }
        evidence: { type: string }
        state: { $ref: "#/components/schemas/FeatureState" }

    RoleSummaries:
      type: object
      required: [seeker, owner, it]
      properties:
        seeker: { type: string }
        owner: { type: string }
        it: { type: string }

    Recommendation:
      type: object
      required:
        - caseId
        - baseSolution
        - overlappingSolutions
        - overallFit
        - summary
        - capabilitiesToAdd
        - capabilitiesToRetain
        - duplicates
        - incompatible
        - retirementCandidates
        - confidence
        - rationale
        - roleSummaries
        - adoptionEffort
      properties:
        caseId: { type: string }
        baseSolution: { $ref: "#/components/schemas/Solution" }
        overlappingSolutions:
          type: array
          items: { $ref: "#/components/schemas/Solution" }
        overallFit: { type: number, description: 0-100 }
        summary: { type: string }
        capabilitiesToAdd:
          type: array
          items: { $ref: "#/components/schemas/CapabilityProvenance" }
        capabilitiesToRetain:
          type: array
          items: { $ref: "#/components/schemas/CapabilityProvenance" }
        duplicates:
          type: array
          items: { $ref: "#/components/schemas/CapabilityProvenance" }
        incompatible:
          type: array
          items: { $ref: "#/components/schemas/CapabilityProvenance" }
        retirementCandidates:
          type: array
          items: { $ref: "#/components/schemas/Solution" }
        confidence: { type: number, description: 0-1 }
        rationale:
          type: array
          items: { type: string }
        roleSummaries: { $ref: "#/components/schemas/RoleSummaries" }
        adoptionEffort: { type: string }

    SampleInput:
      type: object
      required: [id, name, description, solutionIds, text, hasExpected, noteCount]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        solutionIds:
          type: array
          items: { type: string }
        text: { type: string }
        hasExpected: { type: boolean, description: True when labelled expected findings exist for objective scoring }
        noteCount: { type: integer }

    OutputItem:
      type: object
      required: [id, key, kind, text, detail, stepId, refs]
      properties:
        id: { type: string }
        key: { type: string, description: Stable across runs so A and B lines can be matched }
        kind: { type: string }
        text: { type: string }
        detail: { type: ["string", "null"] }
        stepId: { type: string, description: Capability id of the step that produced this line }
        refs:
          type: array
          items: { type: string }

    OutputSection:
      type: object
      required: [key, title, stepId, items]
      properties:
        key: { type: string }
        title: { type: string }
        stepId: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OutputItem" }

    RunOutput:
      type: object
      required: [headline, sections]
      properties:
        headline: { type: string }
        sections:
          type: array
          items: { $ref: "#/components/schemas/OutputSection" }

    StepTrace:
      type: object
      required: [stepId, name, stage, status, inputSummary, transformation, outputSummary, itemCount, durationMs, error]
      properties:
        stepId: { type: string }
        name: { type: string }
        stage: { type: string }
        status:
          type: string
          enum: [ran, skipped, error]
        inputSummary: { type: string }
        transformation: { type: string }
        outputSummary: { type: string }
        itemCount: { type: integer }
        durationMs: { type: integer }
        error: { type: ["string", "null"] }

    RunStats:
      type: object
      required: [steps, sections, items, issues, patterns, actions, errors]
      properties:
        steps: { type: integer }
        sections: { type: integer }
        items: { type: integer }
        issues: { type: integer }
        patterns: { type: integer }
        actions: { type: integer }
        errors: { type: integer }

    Run:
      type: object
      required: [id, caseId, solutionId, version, versionLabel, sampleInputId, inputText, inputHash, enabledCapabilityIds, configValues, configFingerprint, output, trace, stats, durationMs, errors, createdAt]
      properties:
        id: { type: string }
        caseId: { type: ["string", "null"] }
        solutionId: { type: string }
        version:
          type: string
          enum: [A, B]
        versionLabel: { type: string }
        sampleInputId: { type: ["string", "null"] }
        inputText: { type: string }
        inputHash: { type: string }
        enabledCapabilityIds:
          type: array
          items: { type: string }
        configValues:
          type: object
          additionalProperties: { type: string }
        configFingerprint: { type: string, description: Server-computed fingerprint of the exact configuration that ran (sorted capability ids and versions, settings, catalog version) }
        output: { $ref: "#/components/schemas/RunOutput" }
        trace:
          type: array
          items: { $ref: "#/components/schemas/StepTrace" }
        stats: { $ref: "#/components/schemas/RunStats" }
        durationMs: { type: integer }
        errors:
          type: array
          items: { type: string }
        createdAt: { type: string }

    RunRequest:
      type: object
      required: [version]
      properties:
        solutionId: { type: string, description: Run the production workflow of a solution (version A) }
        caseId: { type: string, description: Run a case; version A is the base product, version B the proposed configuration }
        version:
          type: string
          enum: [A, B]
        sampleInputId: { type: string }
        inputText: { type: string, description: Overrides the sample text; used as-is when no sample is given }

    WorkflowBlock:
      type: object
      required: [capability, stage, kind, active, executable, value, options, origin, blockedReason]
      properties:
        capability: { $ref: "#/components/schemas/Capability" }
        stage: { type: string }
        kind:
          type: string
          enum: [required, configurable, optional]
        active: { type: boolean }
        executable: { type: boolean, description: False for controls (identity, audit) that do not transform the input }
        value: { type: ["string", "null"] }
        options:
          type: ["array", "null"]
          items: { type: string }
        origin:
          type: string
          enum: [base, added]
        blockedReason: { type: ["string", "null"] }

    SolutionWorkbench:
      type: object
      required: [solution, blocks, controls, sampleInputs, exampleRun]
      properties:
        solution: { $ref: "#/components/schemas/Solution" }
        blocks:
          type: array
          description: Executable steps in execution order
          items: { $ref: "#/components/schemas/WorkflowBlock" }
        controls:
          type: array
          description: Locked controls preserved around the workflow
          items: { $ref: "#/components/schemas/Capability" }
        sampleInputs:
          type: array
          items: { $ref: "#/components/schemas/SampleInput" }
        exampleRun: { $ref: "#/components/schemas/Run" }

    DiffEntry:
      type: object
      required: [change, sectionKey, sectionTitle, stepId, stepName, sourceSolutionName, workflowStep, addedModule, before, after, itemKey, kind]
      properties:
        change:
          type: string
          enum: [added, removed, changed]
        sectionKey: { type: string }
        sectionTitle: { type: string }
        stepId: { type: string }
        stepName: { type: string }
        sourceSolutionName: { type: string }
        workflowStep: { type: string, description: Workflow stage the responsible step belongs to }
        addedModule: { type: boolean, description: True when the responsible step was added to Version B from another product }
        before: { type: ["string", "null"] }
        after: { type: ["string", "null"] }
        itemKey: { type: string }
        kind: { type: string }

    OutputDiff:
      type: object
      required: [entries, added, removed, changed, unchanged, stepsResponsible]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/DiffEntry" }
        added: { type: integer }
        removed: { type: integer }
        changed: { type: integer }
        unchanged: { type: integer }
        stepsResponsible:
          type: array
          items:
            type: object
            required: [stepId, name, sourceSolutionName, workflowStep, addedModule, changes]
            properties:
              stepId: { type: string }
              name: { type: string }
              sourceSolutionName: { type: string }
              workflowStep: { type: string }
              addedModule: { type: boolean }
              changes: { type: integer }

    ObjectiveScore:
      type: object
      required: [expected, identified, missed, falsePositives, precision, recall, identifiedLabels, missedLabels, falsePositiveLabels]
      properties:
        expected: { type: integer }
        identified: { type: integer }
        missed: { type: integer }
        falsePositives: { type: integer }
        precision: { type: ["number", "null"] }
        recall: { type: ["number", "null"] }
        identifiedLabels:
          type: array
          items: { type: string }
        missedLabels:
          type: array
          items: { type: string }
        falsePositiveLabels:
          type: array
          items: { type: string }

    ABComparison:
      type: object
      required: [caseId, sampleInputId, inputText, inputHash, runA, runB, diff, scoreA, scoreB, explanation, evaluation, staleB]
      properties:
        caseId: { type: string }
        staleB: { type: boolean, description: True when Version B has changed since this run; rerun to refresh }
        sampleInputId: { type: ["string", "null"] }
        inputText: { type: string }
        inputHash: { type: string }
        runA: { $ref: "#/components/schemas/Run" }
        runB: { $ref: "#/components/schemas/Run" }
        diff: { $ref: "#/components/schemas/OutputDiff" }
        scoreA:
          oneOf:
            - $ref: "#/components/schemas/ObjectiveScore"
            - type: "null"
        scoreB:
          oneOf:
            - $ref: "#/components/schemas/ObjectiveScore"
            - type: "null"
        explanation:
          type: array
          description: Plain-language lines explaining what changed and which step caused it
          items: { type: string }
        evaluation:
          oneOf:
            - $ref: "#/components/schemas/Evaluation"
            - type: "null"
          description: The current user's recorded preference for this exact pair, if any

    CompareRequest:
      type: object
      properties:
        sampleInputId: { type: string }
        inputText: { type: string }

    Evaluation:
      type: object
      required: [id, caseId, sessionId, sampleInputId, inputHash, runAId, runBId, fingerprintA, fingerprintB, choice, reason, rating, evaluator, role, blind, demo, createdAt]
      properties:
        id: { type: string }
        caseId: { type: string }
        sessionId: { type: ["string", "null"] }
        sampleInputId: { type: ["string", "null"] }
        inputHash: { type: string }
        runAId: { type: string }
        runBId: { type: string }
        fingerprintA: { type: string, description: Configuration fingerprint of run A when the vote was recorded }
        fingerprintB: { type: string, description: Configuration fingerprint of run B when the vote was recorded }
        choice:
          type: string
          enum: [A, B, neither]
        reason: { type: ["string", "null"] }
        rating: { type: ["integer", "null"] }
        evaluator: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        blind: { type: boolean }
        demo: { type: boolean, description: True for simulated demo accounts }
        createdAt: { type: string }

    EvaluationInput:
      type: object
      required: [runAId, runBId, choice, role, evaluator]
      properties:
        runAId: { type: string }
        runBId: { type: string }
        choice:
          type: string
          enum: [A, B, neither]
        reason: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        role: { $ref: "#/components/schemas/Role" }
        evaluator: { type: string }

    EvaluationSummary:
      type: object
      required: [tests, aPreferred, bPreferred, neither, averageRating, distinctInputs, blindVotes, demoVotes]
      properties:
        tests: { type: integer, description: Recorded evaluations; computed only from stored votes }
        aPreferred: { type: integer }
        bPreferred: { type: integer }
        neither: { type: integer }
        averageRating: { type: ["number", "null"] }
        distinctInputs: { type: integer }
        blindVotes: { type: integer }
        demoVotes: { type: integer }

    EvaluationList:
      type: object
      required: [summary, items, currentFingerprint, setAside]
      properties:
        summary: { $ref: "#/components/schemas/EvaluationSummary", description: Votes recorded against the case's current Version B configuration only }
        items:
          type: array
          description: Votes for the current configuration
          items: { $ref: "#/components/schemas/Evaluation" }
        currentFingerprint: { type: string, description: Fingerprint of the case's current Version B }
        setAside: { type: integer, description: Votes recorded against earlier Version B configurations; reported, never merged }

    TestSessionInput:
      type: object
      required: [createdBy]
      properties:
        createdBy: { type: string }
        title: { type: string }

    TestPair:
      type: object
      required: [sampleInputId, inputName, inputText, left, right, responses, expired]
      properties:
        sampleInputId: { type: string }
        inputName: { type: string }
        inputText: { type: string }
        left: { $ref: "#/components/schemas/RunOutput" }
        right: { $ref: "#/components/schemas/RunOutput" }
        responses: { type: integer }
        expired: { type: boolean, description: True when Version B changed after these runs; the pair no longer accepts responses }

    TestSession:
      type: object
      required: [id, caseId, createdBy, title, closed, pairs, responseCount, results, setAside, createdAt]
      properties:
        id: { type: string }
        caseId: { type: string }
        createdBy: { type: string }
        title: { type: string }
        closed: { type: boolean }
        pairs:
          type: array
          items: { $ref: "#/components/schemas/TestPair" }
        responseCount: { type: integer, description: Responses recorded against the case's current Version B configuration }
        results:
          oneOf:
            - $ref: "#/components/schemas/EvaluationSummary"
            - type: "null"
          description: Aggregate preference for the current configuration, revealed only once responses exist
        setAside: { type: integer, description: Responses recorded against earlier configurations; reported, never merged }
        createdAt: { type: string }

    TestResponseInput:
      type: object
      required: [sampleInputId, pick, tester]
      properties:
        sampleInputId: { type: string }
        pick:
          type: string
          enum: [left, right, neither]
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        tester: { type: string }
        demo: { type: boolean, description: Mark as a simulated demo account vote }

    SearchResult:
      type: object
      required: [solution, score, reasons, matchedCapabilities]
      properties:
        solution: { $ref: "#/components/schemas/Solution" }
        score: { type: number }
        reasons:
          type: array
          items: { type: string }
        matchedCapabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }

    SearchResults:
      type: object
      required: [query, results, capabilities, source]
      properties:
        query: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        capabilities:
          type: array
          description: Reusable capabilities matching the query on their own
          items: { $ref: "#/components/schemas/Capability" }
        source:
          type: string
          enum: [keyword, hybrid]

    OwnedSolution:
      type: object
      required: [solution, proposals, groups, experimentsInProgress, openTests, evaluations, evaluationsSetAside, recentRuns]
      properties:
        solution: { $ref: "#/components/schemas/Solution" }
        proposals:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        groups:
          type: array
          description: Saved or proposed experiments on this product, grouped by intent
          items: { $ref: "#/components/schemas/ImprovementGroup" }
        experimentsInProgress: { type: integer }
        openTests: { type: integer, description: Cases with runs but no owner decision yet }
        evaluations: { type: integer, description: Recorded preference votes across proposals, current configurations only }
        evaluationsSetAside: { type: integer, description: Votes recorded against earlier configurations of those proposals }
        recentRuns: { type: integer, description: Runs recorded in the last 30 days }

    ComponentConfig:
      type: object
      required: [capability, controlType, state, active, executable, value, options, recommended, blockedReason, sourceSolutionName]
      properties:
        capability: { $ref: "#/components/schemas/Capability" }
        controlType: { $ref: "#/components/schemas/ControlType" }
        executable: { type: boolean, description: True when the capability is a workflow step that transforms the input; false for controls }
        state: { $ref: "#/components/schemas/FeatureState" }
        active: { type: boolean }
        value: { type: ["string", "null"] }
        options:
          type: ["array", "null"]
          items: { type: string }
        recommended: { type: boolean }
        blockedReason: { type: ["string", "null"] }
        sourceSolutionName: { type: string }

    WorkflowStepConfig:
      type: object
      required: [name, components]
      properties:
        name: { type: string }
        components:
          type: array
          items: { $ref: "#/components/schemas/ComponentConfig" }

    ImpactDimension:
      type: object
      required: [score, label, note]
      properties:
        score: { type: number, description: 0-100 }
        label: { type: string }
        note: { type: string }

    Impact:
      type: object
      required: [userValue, effort, risk, compatibility, evidenceConfidence, projected]
      properties:
        userValue: { $ref: "#/components/schemas/ImpactDimension" }
        effort: { $ref: "#/components/schemas/ImpactDimension" }
        risk: { $ref: "#/components/schemas/ImpactDimension" }
        compatibility: { $ref: "#/components/schemas/ImpactDimension" }
        evidenceConfidence: { $ref: "#/components/schemas/ImpactDimension" }
        projected:
          $ref: "#/components/schemas/Metrics"
          description: Projected metrics with the current configuration applied

    Configuration:
      type: object
      required: [caseId, summary, steps, impact, activeModuleCount, lockedCount, recommended, isRecommended]
      properties:
        caseId: { type: string }
        summary: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStepConfig" }
        impact: { $ref: "#/components/schemas/Impact" }
        activeModuleCount: { type: integer }
        lockedCount: { type: integer }
        recommended:
          $ref: "#/components/schemas/ConfigurationUpdate"
          description: The recommended module states and settings; send it back to reset the case
        isRecommended: { type: boolean, description: True when the current configuration equals the recommended one }

    ConfigurationUpdate:
      type: object
      properties:
        moduleStates:
          type: object
          additionalProperties: { type: boolean }
        configValues:
          type: object
          additionalProperties: { type: string }

    SyntheticPersona:
      type: object
      required: [id, name, description, experience, volume, dataQuality, changeTolerance, processComplexity]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        experience: { type: number, description: 0-1 }
        volume: { type: number, description: 0-1 }
        dataQuality: { type: number, description: 0-1 }
        changeTolerance: { type: number, description: 0-1 }
        processComplexity: { type: number, description: 0-1 }

    ExperimentPlan:
      type: object
      required: [caseId, baselineName, challengerName, metrics, cohort, recommendedSample, durationWeeks, keyRisks, summary]
      properties:
        caseId: { type: string }
        baselineName: { type: string }
        challengerName: { type: string }
        metrics:
          type: array
          items: { type: string }
        cohort:
          type: array
          items: { $ref: "#/components/schemas/SyntheticPersona" }
        recommendedSample: { type: integer }
        durationWeeks: { type: integer }
        keyRisks:
          type: array
          items: { type: string }
        summary: { type: string }

    ExperimentMetric:
      type: object
      required: [key, label, unit, baseline, proposed, deltaPct, betterWhen, primary, improved]
      properties:
        key: { type: string }
        label: { type: string }
        unit: { type: string }
        baseline: { type: number }
        proposed: { type: number }
        deltaPct: { type: number }
        betterWhen:
          type: string
          enum: [lower, higher]
        primary: { type: boolean }
        improved: { type: boolean }

    SegmentResult:
      type: object
      required: [persona, baselineTaskMinutes, proposedTaskMinutes, baselineSuccessRate, proposedSuccessRate, deltaPct, flag]
      properties:
        persona: { $ref: "#/components/schemas/SyntheticPersona" }
        baselineTaskMinutes: { type: number }
        proposedTaskMinutes: { type: number }
        baselineSuccessRate: { type: number }
        proposedSuccessRate: { type: number }
        deltaPct: { type: number, description: Task-time change, negative is faster }
        flag: { type: ["string", "null"], description: Risk note for weak-performing segments }

    Experiment:
      type: object
      required:
        - id
        - caseId
        - label
        - baselineName
        - challengerName
        - seed
        - cohort
        - metrics
        - segments
        - risks
        - confidence
        - recommendation
        - narrative
        - createdAt
      properties:
        id: { type: string }
        caseId: { type: string }
        label:
          type: string
          description: Always a visible simulated-result disclaimer
        baselineName: { type: string }
        challengerName: { type: string }
        seed: { type: integer }
        cohort:
          type: array
          items: { $ref: "#/components/schemas/SyntheticPersona" }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/ExperimentMetric" }
        segments:
          type: array
          items: { $ref: "#/components/schemas/SegmentResult" }
        risks:
          type: array
          items: { type: string }
        confidence: { type: number, description: 0-1 }
        recommendation: { $ref: "#/components/schemas/ExperimentRecommendation" }
        narrative: { type: string }
        createdAt: { type: string }

    VersionSnapshot:
      type: object
      required: [version, label, workflowSteps, capabilities, userGroups, performance]
      properties:
        version: { type: string }
        label: { type: string }
        workflowSteps:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        userGroups:
          type: array
          items: { type: string }
        performance:
          description: Measured production metrics; null for a proposed version that has not run in production
          oneOf:
            - $ref: "#/components/schemas/Metrics"
            - type: "null"

    ConfigChange:
      type: object
      required: [capabilityName, from, to]
      properties:
        capabilityName: { type: string }
        from: { type: string }
        to: { type: string }

    AffectedGroup:
      type: object
      required: [group, users, impact]
      properties:
        group: { type: string }
        users: { type: integer }
        impact: { type: string }

    PilotPlan:
      type: object
      required:
        - eligibleGroup
        - pilotPercent
        - pilotUsers
        - durationWeeks
        - successThresholds
        - guardrails
        - monitoring
        - rollbackTrigger
        - ownerApprovalRequired
        - itApprovalRequired
      properties:
        eligibleGroup: { type: string }
        pilotPercent: { type: integer }
        pilotUsers: { type: integer }
        durationWeeks: { type: integer }
        successThresholds:
          type: array
          items: { type: string }
        guardrails:
          type: array
          items: { type: string }
        monitoring:
          type: array
          items: { type: string }
        rollbackTrigger: { type: string }
        ownerApprovalRequired: { type: boolean }
        itApprovalRequired: { type: boolean }

    ChangeReview:
      type: object
      required:
        - case
        - baseSolution
        - currentVersion
        - proposedVersion
        - added
        - removed
        - changedConfig
        - unchanged
        - affectedUsers
        - newDependencies
        - experiment
        - pilotPlan
        - ownerSummary
        - decisions
        - availableActions
        - evidence
        - promotionGate
      properties:
        case: { $ref: "#/components/schemas/Case" }
        evidence: { $ref: "#/components/schemas/EvidenceSummary" }
        promotionGate:
          type: array
          description: The production-promotion checklist with live values; unmet items are shown, never hidden
          items: { $ref: "#/components/schemas/GateItem" }
        baseSolution: { $ref: "#/components/schemas/Solution" }
        currentVersion: { $ref: "#/components/schemas/VersionSnapshot" }
        proposedVersion: { $ref: "#/components/schemas/VersionSnapshot" }
        added:
          type: array
          items: { $ref: "#/components/schemas/CapabilityProvenance" }
        removed:
          type: array
          items: { $ref: "#/components/schemas/CapabilityProvenance" }
        changedConfig:
          type: array
          items: { $ref: "#/components/schemas/ConfigChange" }
        unchanged:
          type: array
          items: { type: string }
        affectedUsers:
          type: array
          items: { $ref: "#/components/schemas/AffectedGroup" }
        newDependencies:
          type: array
          items: { type: string }
        experiment:
          oneOf:
            - $ref: "#/components/schemas/Experiment"
            - type: "null"
        pilotPlan: { $ref: "#/components/schemas/PilotPlan" }
        ownerSummary: { type: string }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/Decision" }
        availableActions:
          type: array
          description: Decision actions currently permitted per role
          items:
            type: object
            required: [role, actions]
            properties:
              role: { $ref: "#/components/schemas/Role" }
              actions:
                type: array
                items: { $ref: "#/components/schemas/DecisionAction" }

    EvidenceSummary:
      type: object
      description: Evidence for the case's current Version B configuration, plus what was set aside
      required: [currentFingerprint, inputsTested, runtimeA, runtimeB, labelled, votes, setAside]
      properties:
        currentFingerprint: { type: string }
        inputsTested: { type: integer, description: Distinct inputs on which the current configuration ran against the baseline }
        runtimeA: { type: ["integer", "null"] }
        runtimeB: { type: ["integer", "null"] }
        labelled:
          oneOf:
            - type: object
              required: [inputs, recallA, recallB, precisionA, precisionB]
              properties:
                inputs: { type: integer }
                recallA: { type: number }
                recallB: { type: number }
                precisionA: { type: number }
                precisionB: { type: number }
            - type: "null"
        votes:
          oneOf:
            - $ref: "#/components/schemas/EvaluationSummary"
            - type: "null"
        setAside: { type: integer, description: Votes from earlier configurations, reported separately }

    GateItem:
      type: object
      required: [key, label, met, value]
      properties:
        key: { type: string }
        label: { type: string }
        met: { type: boolean }
        value: { type: string, description: The real value behind the check }

    PortfolioMetric:
      type: object
      required: [key, label, value, numerator, denominator, definition, demo]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: string }
        numerator: { type: ["number", "null"] }
        denominator: { type: ["number", "null"] }
        definition: { type: string }
        demo: { type: boolean, description: True when the number comes from seeded demonstration data }

    PortfolioMetrics:
      type: object
      required: [searchToReuse, duplicateGroups, consolidationsCompleted, abTestsWithPreference, activeVsRetired, needsAttention]
      properties:
        searchToReuse: { $ref: "#/components/schemas/PortfolioMetric" }
        duplicateGroups: { $ref: "#/components/schemas/PortfolioMetric" }
        consolidationsCompleted: { $ref: "#/components/schemas/PortfolioMetric" }
        abTestsWithPreference: { $ref: "#/components/schemas/PortfolioMetric" }
        activeVsRetired: { $ref: "#/components/schemas/PortfolioMetric" }
        needsAttention: { $ref: "#/components/schemas/PortfolioMetric" }

    PortfolioRow:
      type: object
      required: [businessProblem, solutions, activeSolutions, recommendedAction, status, caseId]
      properties:
        businessProblem: { $ref: "#/components/schemas/BusinessProblem" }
        solutions:
          type: array
          items: { $ref: "#/components/schemas/Solution" }
        activeSolutions: { type: integer }
        recommendedAction: { type: string }
        status: { type: string }
        caseId: { type: ["string", "null"] }

    EvidenceEvent:
      type: object
      required: [at, actor, event]
      properties:
        at: { type: string }
        actor: { type: string }
        event: { type: string }

    ConsolidationSummary:
      type: object
      required:
        - case
        - baseSolution
        - overlappingSolutions
        - reusableCapabilities
        - retirementCandidate
        - ownerName
        - architectureStatus
        - controlStatus
        - duplicationReductionPct
        - migrationEffort
        - evidenceTrail
        - valueStatement
        - experimentRecommendation
      properties:
        case: { $ref: "#/components/schemas/Case" }
        baseSolution: { $ref: "#/components/schemas/Solution" }
        overlappingSolutions:
          type: array
          items: { $ref: "#/components/schemas/Solution" }
        reusableCapabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
        retirementCandidate:
          oneOf:
            - $ref: "#/components/schemas/Solution"
            - type: "null"
        ownerName: { type: string }
        architectureStatus: { type: string }
        controlStatus: { type: string }
        duplicationReductionPct: { type: number }
        migrationEffort: { type: string }
        evidenceTrail:
          type: array
          items: { $ref: "#/components/schemas/EvidenceEvent" }
        valueStatement: { type: string }
        experimentRecommendation:
          oneOf:
            - $ref: "#/components/schemas/ExperimentRecommendation"
            - type: "null"

    Portfolio:
      type: object
      required: [headline, valueStatement, metrics, rows, consolidationCases, unsupportedSolutions, duplicateCapabilities]
      properties:
        headline: { type: string }
        valueStatement: { type: string }
        metrics: { $ref: "#/components/schemas/PortfolioMetrics" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/PortfolioRow" }
        consolidationCases:
          type: array
          items: { $ref: "#/components/schemas/ConsolidationSummary" }
        unsupportedSolutions:
          type: array
          items: { $ref: "#/components/schemas/Solution" }
        duplicateCapabilities:
          type: array
          items:
            type: object
            required: [category, capabilities]
            properties:
              category: { type: string }
              capabilities:
                type: array
                items: { $ref: "#/components/schemas/Capability" }

    SeekerOverview:
      type: object
      required: [headline, recentBriefs, recommendedSolutions, savedCases, demoPrompt]
      properties:
        headline: { type: string }
        recentBriefs:
          type: array
          items: { $ref: "#/components/schemas/Brief" }
        recommendedSolutions:
          type: array
          items: { $ref: "#/components/schemas/Solution" }
        savedCases:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        demoPrompt:
          type: string
          description: The pre-seeded demonstration pain point, usable as a one-click example

    OwnerSolution:
      type: object
      required: [solution, pendingChanges, openExperiments, sharedCapabilityCount, proposedDecision]
      properties:
        solution: { $ref: "#/components/schemas/Solution" }
        pendingChanges: { type: integer }
        openExperiments: { type: integer }
        sharedCapabilityCount: { type: integer }
        proposedDecision: { type: ["string", "null"] }

    OwnerOverview:
      type: object
      required: [headline, ownerName, mySolutions, proposedChanges, pendingExperiments, versionsRequiringReview]
      properties:
        headline: { type: string }
        ownerName: { type: string }
        mySolutions:
          type: array
          items: { $ref: "#/components/schemas/OwnerSolution" }
        proposedChanges:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        pendingExperiments:
          type: array
          items: { $ref: "#/components/schemas/Experiment" }
        versionsRequiringReview:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }

    DemoState:
      type: object
      required: [ok, demoBriefId, demoCaseId, demoPrompt, aiAvailable]
      properties:
        ok: { type: boolean }
        demoBriefId: { type: string }
        demoCaseId: { type: string }
        demoPrompt: { type: string }
        aiAvailable: { type: boolean }
