components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token, Bearer sid.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    CodeAssessment:
      type: object
      required: [briefId, package, bestSolutionId, candidates, requirements, limitations]
      properties:
        briefId: { type: string }
        package: { $ref: "#/components/schemas/LibraryCodePackage" }
        bestSolutionId: { type: [string, "null"] }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/CodeCandidate" }
        requirements:
          type: array
          items: { $ref: "#/components/schemas/CodeRequirementAssessment" }
        limitations: { type: array, items: { type: string } }
    LibraryCodePackage:
      type: object
      required: [packageId, version, sha256, scope, createdAt, files, capabilities, checks, configurations]
      properties:
        packageId: { type: string }
        version: { type: string }
        sha256: { type: string }
        scope: { type: string }
        createdAt: { type: string }
        files:
          type: array
          items:
            type: object
            required: [path, sha256]
            properties:
              path: { type: string }
              sha256: { type: string }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/CodeCapabilityEvidence" }
        checks:
          type: array
          items:
            type: object
            required: [name, passed]
            properties:
              name: { type: string }
              passed: { type: boolean }
        configurations:
          type: array
          items:
            type: object
            required: [solutionId, capabilityIds]
            properties:
              solutionId: { type: string }
              capabilityIds: { type: array, items: { type: string } }
    CodeCapabilityEvidence:
      type: object
      required: [capabilityId, solutionId, file, symbol, lines, limitations, tested]
      properties:
        capabilityId: { type: string }
        solutionId: { type: string }
        file: { type: string }
        symbol: { type: string }
        lines: { type: array, items: { type: integer } }
        limitations: { type: array, items: { type: string } }
        tested: { type: boolean }
    CodeCandidate:
      type: object
      required: [solutionId, name, covered, borrowable, partial, missing, weightedCoverage]
      properties:
        solutionId: { type: string }
        name: { type: string }
        covered: { type: integer }
        borrowable: { type: integer }
        partial: { type: integer }
        missing: { type: integer }
        weightedCoverage: { type: number }
    CodeRequirementAssessment:
      type: object
      required: [id, text, priority, status, matches, note]
      properties:
        id: { type: string }
        text: { type: string }
        priority: { type: integer }
        status: { type: string, enum: [covered, borrow, partial, missing, constraint] }
        note: { type: string }
        matches:
          type: array
          items: { $ref: "#/components/schemas/CodeAssessmentMatch" }
    CodeAssessmentMatch:
      type: object
      required: [capabilityId, capabilityName, solutionId, solutionName, evidence, integration]
      properties:
        capabilityId: { type: string }
        capabilityName: { type: string }
        solutionId: { type: string }
        solutionName: { type: string }
        evidence: { $ref: "#/components/schemas/CodeCapabilityEvidence" }
        integration: { type: string }
    IntakeComparison:
      type: object
      required: [briefId]
      properties:
        briefId: { type: string }
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    IntakeSession:
      type: object
      required: [user]
      properties:
        user:
          type: [object, "null"]
          properties:
            id: { type: string }
            name: { type: string }
    IntakeRecord:
      type: object
      required: [id, title, model, revision, status, updatedAt, attachments]
      properties:
        id: { type: string }
        title: { type: string }
        model: { type: object, additionalProperties: true }
        revision: { type: integer }
        status: { type: string, enum: [draft, review, confirmed] }
        updatedAt: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/IntakeAttachment" }
    IntakeRecordInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    IntakeRecordUpdate:
      type: object
      required: [title, model, revision]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        model: { type: object, additionalProperties: true }
        revision: { type: integer, minimum: 1 }
    IntakeRevisionInput:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
    IntakeFileInput:
      type: object
      required: [file, sourceId]
      properties:
        file: { type: string, format: binary }
        sourceId: { type: string, enum: [problem, prototype, agent] }
    IntakeAttachment:
      type: object
      required: [id, name, sourceId, size, status, text, error]
      properties:
        id: { type: string }
        name: { type: string }
        sourceId: { type: string, enum: [problem, prototype, agent] }
        size: { type: integer }
        status: { type: string, enum: [extracted, reference, failed] }
        text: { type: string }
        error: { type: [string, "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Role:
      type: string
      enum: [seeker, owner, it]

    SolutionStatus:
      type: string
      enum: [certified, pilot, experimental, deprecated]

    SolutionKind:
      type: string
      enum: [complete_solution, configurable_product, capability_module, prototype]

    EvidenceLevel:
      type: string
      enum: [strong, moderate, limited, none]

    EffortLevel:
      type: string
      enum: [low, medium, high]

    ControlType:
      type: string
      enum: [locked, configurable, optional]

    FeatureState:
      type: string
      enum: [required, configurable, optional, incompatible, recommended, retiring]

    CaseStatus:
      type: string
      description: folded = the approved change was published as a successor version of the parent product
      enum: [draft, tested, pilot_proposed, approved, changes_requested, deferred, rejected, folded]

    DecisionAction:
      type: string
      description: >-
        propose_pilot = propose the improvement to the parent product (pilot exposure is a detail of that proposal);
        propose_capability = propose an added capability as reusable; request_new_family = ask for a new solution family (reason required);
        adopt_approach, merge_approaches, request_more_evidence, keep_local, decline = grouped owner decisions on a shared improvement.
      enum: [propose_pilot, propose_capability, request_new_family, approve_pilot, request_changes, defer, reject, approve_consolidation, withdraw_consolidation, adopt_approach, merge_approaches, request_more_evidence, keep_local, decline]

    PromotionState:
      type: string
      description: Where the experiment stands relative to its parent product; it never becomes a product on its own
      enum: [experiment, proposed_to_parent, proposed_capability, new_family_requested]

    CaseLineage:
      type: object
      description: The exact difference between this experiment and its parent version, derived from the configuration fingerprint
      required: [parentSolutionId, parentSolutionName, parentVersion, fingerprint, added, removed, changedSettings, intent, intentKey, summary]
      properties:
        parentSolutionId: { type: string }
        parentSolutionName: { type: string }
        parentVersion: { type: string }
        fingerprint: { type: string, description: Fingerprint of the experiment's current configuration }
        added:
          type: array
          description: Capability names switched on that the parent version does not run
          items: { type: string }
        removed:
          type: array
          description: Parent capabilities switched off in the experiment
          items: { type: string }
        changedSettings:
          type: array
          items: { $ref: "#/components/schemas/ConfigChange" }
        intent: { type: string, description: The requirement or added capability that defines the experiment }
        intentKey: { type: string, description: Stable key used to group experiments with the same intent }
        summary: { type: string, description: One line, e.g. "Adds Safety Signals · 1 setting changed" }

    SimilarExperiment:
      type: object
      required: [case, sameApproach, changes, votes, inputsTested]
      properties:
        case: { $ref: "#/components/schemas/Case" }
        sameApproach: { type: boolean, description: True when the other experiment's current configuration is identical }
        changes:
          type: array
          items: { type: string }
        votes:
          oneOf:
            - $ref: "#/components/schemas/EvaluationSummary"
            - type: "null"
          description: Preference votes on that experiment's current configuration only
        inputsTested: { type: integer }

    SimilarExperiments:
      type: object
      required: [count, teams, experiments]
      properties:
        count: { type: integer }
        teams: { type: integer, description: Distinct teams behind the similar experiments }
        experiments:
          type: array
          items: { $ref: "#/components/schemas/SimilarExperiment" }

    ImprovementGroup:
      type: object
      description: Experiments on one parent product that share an intent, with counts from current-configuration evidence only
      required: [key, solutionId, intent, experiments, teams, completedTests, preferredModifiedPercent, approaches, pendingReview]
      properties:
        key: { type: string }
        solutionId: { type: string }
        intent: { type: string }
        experiments:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        teams: { type: integer }
        completedTests: { type: integer, description: Recorded votes on the current configuration of each experiment }
        preferredModifiedPercent:
          type: ["number", "null"]
          description: Share of those votes that preferred the modified output; null when there are none
        approaches: { type: integer, description: Distinct current configurations across the experiments }
        pendingReview: { type: boolean, description: At least one experiment is proposed and awaiting the owner }

    ImprovementApproach:
      type: object
      required: [fingerprint, label, changes, experiments, teams, votes, inputsTested]
      properties:
        fingerprint: { type: string }
        label: { type: string }
        changes:
          type: array
          items: { type: string }
        experiments:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        teams:
          type: array
          items: { type: string }
        votes:
          oneOf:
            - $ref: "#/components/schemas/EvaluationSummary"
            - type: "null"
        inputsTested: { type: integer }

    ImprovementGroupDetail:
      type: object
      required: [group, solution, approaches, decisions, availableActions]
      properties:
        group: { $ref: "#/components/schemas/ImprovementGroup" }
        solution: { $ref: "#/components/schemas/Solution" }
        approaches:
          type: array
          items: { $ref: "#/components/schemas/ImprovementApproach" }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/Decision" }
        availableActions:
          type: array
          items: { $ref: "#/components/schemas/DecisionAction" }

    GroupDecisionInput:
      type: object
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/DecisionAction" }
        caseId: { type: string, description: The experiment adopted; required for adopt_approach }
        reason: { type: string }

    ExperimentRecommendation:
      type: string
      enum: [proceed_to_pilot, revise_configuration, gather_more_evidence, do_not_proceed]

    Persona:
      type: object
      required: [id, role, name, title, team, headline]
      properties:
        id: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        name: { type: string }
        title: { type: string }
        team: { type: string }
        headline: { type: string }

    Metrics:
      type: object
      description: Operating metrics for one task on one solution version
      required: [taskMinutes, successRate, effortScore, errorRate, adoption, costPerTask]
      properties:
        taskMinutes: { type: number, description: Average minutes to complete the task }
        successRate: { type: number, description: 0-100 percent }
        effortScore: { type: number, description: 1 (low) to 10 (high) user effort }
        errorRate: { type: number, description: 0-100 percent exceptions }
        adoption: { type: number, description: 0-100 percent expected adoption }
        costPerTask: { type: number, description: Currency per task }

    SolutionVersion:
      type: object
      required: [version, releasedAt, summary, state, caseId, foldedCapabilities, changedSettings]
      properties:
        version: { type: string }
        releasedAt: { type: string }
        summary: { type: string }
        state:
          type: string
          description: released = catalog version; draft = owner-approved successor awaiting IT; current = published governed version
          enum: [released, draft, current]
        caseId: { type: ["string", "null"], description: The experiment whose evidence produced this version }
        foldedCapabilities:
          type: array
          items: { $ref: "#/components/schemas/FoldedCapability" }
        changedSettings:
          type: array
          items: { type: string }
        production:
          description: The production configuration this version applies (optional-module states and configurable values); absent for catalog versions
          oneOf:
            - $ref: "#/components/schemas/ProductionConfig"
            - type: "null"

    ProductionConfig:
      type: object
      required: [moduleStates, configValues]
      properties:
        moduleStates:
          type: object
          additionalProperties: { type: boolean }
        configValues:
          type: object
          additionalProperties: { type: string }

    FoldedCapability:
      type: object
      required: [capabilityId, name, sourceSolutionId, sourceSolutionName, experimentOwner, tests, preferredPercent, provenance]
      properties:
        capabilityId: { type: string }
        name: { type: string }
        sourceSolutionId: { type: string }
        sourceSolutionName: { type: string }
        experimentOwner: { type: string }
        tests: { type: integer }
        preferredPercent: { type: ["integer", "null"] }
        provenance: { type: string, description: e.g. from Pattern Finder, via experiment by Alex Romero, 7 tests, 68% preferred }

    DispositionKind:
      type: string
      enum: [retain, fold_into, configure, rebuild, retire]

    Disposition:
      type: object
      description: What happens to a product under a consolidation; a proposal until IT confirms the direction
      required: [id, caseId, solutionId, kind, state, targetSolutionId, targetSolutionName, targetVersion, reason, migrationNote, preferred, label]
      properties:
        id: { type: string }
        caseId: { type: string }
        solutionId: { type: string }
        kind: { $ref: "#/components/schemas/DispositionKind" }
        state:
          type: string
          enum: [proposed, confirmed]
        targetSolutionId: { type: ["string", "null"] }
        targetSolutionName: { type: ["string", "null"] }
        targetVersion: { type: ["string", "null"] }
        reason: { type: ["string", "null"] }
        migrationNote: { type: ["string", "null"], description: Recorded once users have moved; a retirement stays scheduled until then }
        preferred: { type: boolean, description: The product preferred for this business problem }
        label: { type: string, description: Plain-language badge, e.g. Folding into Work Order Triage v3.3 }

    Solution:
      type: object
      required:
        - id
        - name
        - outcome
        - description
        - status
        - kind
        - ownerName
        - ownerTeam
        - businessUnits
        - activeUsers
        - evidenceLevel
        - timeToAdopt
        - adoptionEffort
        - workflowSteps
        - currentVersion
        - versions
        - knownGaps
        - dependencies
        - capabilityIds
        - businessProblemIds
        - baselineMetrics
        - retirementCandidate
        - architectureStatus
        - controlStatus
        - supportModel
        - lastReviewedAt
        - disposition
        - businessFunction
        - primaryUsers
        - workflowType
        - outputType
        - riskTier
        - dataInvolved
        - controls
        - execution
        - outputPreview
      properties:
        id: { type: string }
        name: { type: string }
        businessFunction: { $ref: "#/components/schemas/BusinessFunction" }
        primaryUsers:
          type: array
          description: Business roles that use the product day to day
          items: { type: string }
        workflowType: { type: string, description: e.g. Review and approve, Draft and proof, Plan and compare }
        outputType: { type: string, description: What the product produces, e.g. Report, Draft disclosure, Schedule, Alert, Decision pack }
        riskTier: { $ref: "#/components/schemas/EffortLevel", description: Business risk of the output; high for financial, investor and regulatory outputs }
        dataInvolved:
          type: array
          items: { type: string }
        controls:
          type: array
          description: Controls the product applies (source linking, segregation of duties, no external publication, ...)
          items: { type: string }
        execution:
          type: string
          enum: [live, preview]
          description: live = FUSEBOX runs this product's workflow on real input for A/B tests; preview = only a deterministic output preview on sample data exists, so no A/B evidence can be produced yet
        outputPreview:
          description: Deterministic output preview on fixed sample data for products without an execution engine; never evidence
          oneOf:
            - $ref: "#/components/schemas/OutputPreview"
            - type: "null"
        disposition:
          description: Governance disposition recorded for this product, if any
          oneOf:
            - $ref: "#/components/schemas/Disposition"
            - type: "null"
        production:
          description: Published production overrides from governed successor versions (module states and configurable values); null when the catalog defaults apply
          oneOf:
            - $ref: "#/components/schemas/ProductionConfig"
            - type: "null"
        origin:
          description: Set only on prototypes registered through the prototype entrance; the platform it runs on outside FUSEBOX
          oneOf:
            - $ref: "#/components/schemas/PrototypeOrigin"
            - type: "null"
        outcome: { type: string, description: One-sentence outcome }
        description: { type: string }
        status: { $ref: "#/components/schemas/SolutionStatus" }
        kind: { $ref: "#/components/schemas/SolutionKind" }
        ownerName: { type: string }
        ownerTeam: { type: string }
        businessUnits:
          type: array
          items: { type: string }
        activeUsers: { type: integer }
        evidenceLevel: { $ref: "#/components/schemas/EvidenceLevel" }
        timeToAdopt: { type: string }
        adoptionEffort: { $ref: "#/components/schemas/EffortLevel" }
        workflowSteps:
          type: array
          items: { type: string }
        currentVersion: { type: string }
        versions:
          type: array
          items: { $ref: "#/components/schemas/SolutionVersion" }
        knownGaps:
          type: array
          items: { type: string }
        dependencies:
          type: array
          items: { type: string }
        capabilityIds:
          type: array
          items: { type: string }
        businessProblemIds:
          type: array
          items: { type: string }
        baselineMetrics: { $ref: "#/components/schemas/Metrics" }
        retirementCandidate: { type: boolean }
        architectureStatus: { type: string }
        controlStatus: { type: string }
        supportModel: { type: string }
        lastReviewedAt: { type: string }

    Capability:
      type: object
      required:
        - id
        - name
        - description
        - category
        - sourceSolutionId
        - sourceSolutionName
        - ownerName
        - controlType
        - workflowStep
        - riskClass
        - evidenceLevel
        - lockedReason
        - options
        - defaultOption
        - effects
        - incompatibleWith
        - dependsOn
        - testCoverage
        - supportStatus
        - version
        - evidence
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        sourceSolutionId: { type: string }
        sourceSolutionName: { type: string }
        ownerName: { type: string }
        controlType: { $ref: "#/components/schemas/ControlType" }
        workflowStep: { type: string }
        riskClass: { $ref: "#/components/schemas/EffortLevel" }
        evidenceLevel: { $ref: "#/components/schemas/EvidenceLevel" }
        lockedReason: { type: ["string", "null"] }
        options:
          type: ["array", "null"]
          items: { type: string }
        defaultOption: { type: ["string", "null"] }
        effects:
          $ref: "#/components/schemas/Metrics"
          description: Expected deltas applied when the capability is active
        incompatibleWith:
          type: array
          items: { type: string }
        dependsOn:
          type: array
          items: { type: string }
        testCoverage: { type: string }
        supportStatus: { type: string }
        version: { type: string }
        evidence: { type: string }

    SolutionDetail:
      type: object
      required: [solution, capabilities, businessProblems, openCases, experimentsInProgress, prototype, comparedPrototypes]
      properties:
        solution: { $ref: "#/components/schemas/Solution" }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
        businessProblems:
          type: array
          items: { $ref: "#/components/schemas/BusinessProblem" }
        openCases:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        experimentsInProgress:
          type: array
          description: Saved or proposed experiments branched from this product; never library entries
          items: { $ref: "#/components/schemas/CaseSummary" }
        prototype:
          description: Set when this entry is a registered prototype
          oneOf:
            - $ref: "#/components/schemas/RegisteredPrototype"
            - type: "null"
        comparedPrototypes:
          type: array
          description: Registered prototypes compared against this product (duplicating or extending it, or whose example it ran)
          items: { $ref: "#/components/schemas/RegisteredPrototype" }

    BusinessFunction:
      type: string
      description: Enterprise function (the busbar a problem hangs from in the schematic)
      enum: [Operations, Finance, Investor relations, ESG & Regulatory, Supply chain & Planning, Commercial & Legal, Corporate & Executive]

    OutputPreview:
      type: object
      description: A fixed, deterministic preview of what a product produces, computed from named sample inputs. Shown as a preview, never as test evidence.
      required: [title, inputs, sections, note]
      properties:
        title: { type: string, description: e.g. September 2026 management pack (sample) }
        inputs:
          type: array
          description: The sample inputs the preview was built from
          items: { type: string }
        sections:
          type: array
          items:
            type: object
            required: [heading, lines]
            properties:
              heading: { type: string }
              lines:
                type: array
                items: { type: string }
        note: { type: string, description: Why this is a preview and what it would take to run it for real }

    BusinessProblem:
      type: object
      required: [id, title, description, activeSolutionIds, recommendedAction, status, businessFunction, primaryUser]
      properties:
        id: { type: string }
        title: { type: string }
        businessFunction: { $ref: "#/components/schemas/BusinessFunction" }
        primaryUser: { type: string, description: The business role that owns this problem day to day }
        description: { type: string }
        activeSolutionIds:
          type: array
          items: { type: string }
        recommendedAction:
          type: string
          enum: [consolidate, standardize, retain, retire]
        status: { type: string }

    BriefField:
      type: object
      required: [value, confidence]
      properties:
        value: { type: string }
        confidence: { type: number, description: 0-1 }

    BriefFields:
      type: object
      required:
        - user
        - job
        - currentProcess
        - painPoint
        - desiredOutcome
        - constraints
        - data
        - requiredControls
        - successMeasures
      properties:
        user: { $ref: "#/components/schemas/BriefField" }
        job: { $ref: "#/components/schemas/BriefField" }
        currentProcess: { $ref: "#/components/schemas/BriefField" }
        painPoint: { $ref: "#/components/schemas/BriefField" }
        desiredOutcome: { $ref: "#/components/schemas/BriefField" }
        constraints: { $ref: "#/components/schemas/BriefField" }
        data: { $ref: "#/components/schemas/BriefField" }
        requiredControls: { $ref: "#/components/schemas/BriefField" }
        successMeasures: { $ref: "#/components/schemas/BriefField" }

    Brief:
      type: object
      required:
        - id
        - rawText
        - fields
        - clarifyingQuestion
        - clarification
        - source
        - valueStatement
        - today
        - better
        - requirements
        - confirmed
        - createdAt
      properties:
        id: { type: string }
        rawText: { type: string }
        today: { type: string, description: What is happening now, one sentence, editable }
        better: { type: string, description: The outcome the user wants, one sentence, editable }
        requirements:
          type: array
          description: Short requirements derived from "Better" plus any the user added; editable
          items: { $ref: "#/components/schemas/BriefRequirement" }
        fields: { $ref: "#/components/schemas/BriefFields" }
        clarifyingQuestion:
          type: ["string", "null"]
          description: At most one clarifying question, only when necessary
        clarification: { type: ["string", "null"] }
        source:
          type: string
          enum: [ai, cached, fallback]
          description: ai = live model, cached = demo prompt cache, fallback = deterministic rules
        valueStatement:
          type: string
          description: Immediate value statement, e.g. how many existing products address the need
        confirmed: { type: boolean }
        createdAt: { type: string }

    BriefInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 10 }

    BriefFieldValues:
      type: object
      properties:
        user: { type: string }
        job: { type: string }
        currentProcess: { type: string }
        painPoint: { type: string }
        desiredOutcome: { type: string }
        constraints: { type: string }
        data: { type: string }
        requiredControls: { type: string }
        successMeasures: { type: string }

    BriefUpdate:
      type: object
      properties:
        fields: { $ref: "#/components/schemas/BriefFieldValues" }
        today: { type: string }
        better: { type: string }
        requirements:
          type: array
          description: Full replacement of the requirements list
          items: { $ref: "#/components/schemas/BriefRequirementInput" }
        confirmed: { type: boolean }
        clarification: { type: string }

    FitLabel:
      type: string
      enum: [strong, good, partial, weak]

    MatchScoring:
      type: object
      required: [semantic, workflow, persona, readiness, evidence, integration]
      properties:
        semantic: { type: number }
        workflow: { type: number }
        persona: { type: number }
        readiness: { type: number }
        evidence: { type: number }
        integration: { type: number }

    SolutionMatch:
      type: object
      required: [rank, solution, fitScore, fitLabel, recommended, whyMatched, gaps, scoring]
      properties:
        rank: { type: integer }
        solution: { $ref: "#/components/schemas/Solution" }
        fitScore: { type: number, description: 0-100 }
        fitLabel: { $ref: "#/components/schemas/FitLabel" }
        recommended: { type: boolean }
        whyMatched:
          type: array
          items: { type: string }
        gaps:
          type: array
          items: { type: string }
        scoring: { $ref: "#/components/schemas/MatchScoring" }

    CapabilityMatch:
      type: object
      required: [capability, fitScore, whyMatched]
      properties:
        capability: { $ref: "#/components/schemas/Capability" }
        fitScore: { type: number }
        whyMatched:
          type: array
          items: { type: string }

    MatchResult:
      type: object
      required: [briefId, headline, matches, capabilityMatches, missingRequirements, coverage, existingCaseId]
      properties:
        briefId: { type: string }
        headline: { type: string }
        matches:
          type: array
          items: { $ref: "#/components/schemas/SolutionMatch" }
        capabilityMatches:
          type: array
          items: { $ref: "#/components/schemas/CapabilityMatch" }
        missingRequirements:
          type: array
          items: { type: string }
        coverage:
          type: array
          description: One row per brief requirement, measured against the recommended solution
          items: { $ref: "#/components/schemas/RequirementCoverage" }
        existingCaseId:
          type: ["string", "null"]
          description: Case already started from this brief, if any

    BriefRequirement:
      type: object
      required: [id, text, source]
      properties:
        id: { type: string }
        text: { type: string }
        source:
          type: string
          enum: [derived, added]
          description: derived = read from the brief's "Better" statement; added = typed by the user

    BriefRequirementInput:
      type: object
      required: [text]
      properties:
        id: { type: string }
        text: { type: string, minLength: 3 }
        source:
          type: string
          enum: [derived, added]

    CoverageStatus:
      type: string
      enum: [covered, covered_reusable, uncovered]
      description: covered = the recommended solution has it; covered_reusable = a module from a sibling product has it; uncovered = nothing in the product family

    RequirementCoverage:
      type: object
      required: [requirementId, text, status, coveredBy, capabilityId, capabilityName, score]
      properties:
        requirementId: { type: string }
        text: { type: string }
        status: { $ref: "#/components/schemas/CoverageStatus" }
        coveredBy:
          type: ["string", "null"]
          description: Name of the product that covers the requirement
        capabilityId: { type: ["string", "null"] }
        capabilityName: { type: ["string", "null"] }
        score:
          type: ["number", "null"]
          description: Reuse-fit score of the covering capability (0-100)

    ReuseTrigger:
      type: string
      enum: [discover_requirement, add_step, add_requirement, save, search, seed, prototype]

    ReusePath:
      type: string
      enum: [try_existing, improve_existing, new_experiment, hard_exclusion]
      description: try_existing >= 80, improve_existing 60-79, new_experiment < 60, hard_exclusion when a rule disqualifies the option

    ReusePathTaken:
      type: string
      enum: [use, improve, create, dismissed, explored]
      description: use/improve/create = a path actually taken (capability tried or improved, experiment started); explored = the person only opened a page; dismissed = closed without a choice

    ReuseOptionKind:
      type: string
      enum: [capability, configuration, experiment, create]

    ReuseFitDimensions:
      type: object
      description: Each dimension is 0-100; the weights are problem fit 30, input/output 20, workflow position 15, user context 10, data/control 15, maturity/evidence 10
      required: [problemFit, inputOutput, workflowPosition, userContext, dataControl, maturityEvidence]
      properties:
        problemFit: { type: number }
        inputOutput: { type: number }
        workflowPosition: { type: number }
        userContext: { type: number }
        dataControl: { type: number }
        maturityEvidence: { type: number }

    ReuseOption:
      type: object
      required: [kind, title, subtitle, score, path, reasons, exclusions, dimensions, capability, solutionId, solutionName, caseId, addableTo]
      properties:
        kind: { $ref: "#/components/schemas/ReuseOptionKind" }
        title: { type: string }
        subtitle: { type: string }
        score:
          type: ["number", "null"]
          description: 0-100 reuse-fit score; null for the create option
        path: { $ref: "#/components/schemas/ReusePath" }
        reasons:
          type: array
          items: { type: string }
        exclusions:
          type: array
          description: Hard-exclusion rules that fired, in plain language
          items: { type: string }
        dimensions:
          oneOf:
            - $ref: "#/components/schemas/ReuseFitDimensions"
            - type: "null"
        capability:
          oneOf:
            - $ref: "#/components/schemas/Capability"
            - type: "null"
        solutionId: { type: ["string", "null"] }
        solutionName: { type: ["string", "null"] }
        caseId:
          type: ["string", "null"]
          description: Set when the option is an active experiment
        addableTo:
          type: ["string", "null"]
          description: Base solution id the capability can be added to in the workbench, when the context allows it

    ReuseCheckInput:
      type: object
      required: [need, trigger]
      properties:
        need: { type: string, minLength: 3 }
        trigger: { $ref: "#/components/schemas/ReuseTrigger" }
        baseSolutionId: { type: string }
        caseId: { type: string }
        briefId: { type: string }
        requirementId: { type: string }
        workflowStep: { type: string }

    ReuseCheckResult:
      type: object
      required: [eventId, need, options, best, recommendedPath, surfaced]
      properties:
        eventId: { type: string }
        need: { type: string }
        options:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ReuseOption" }
        best:
          oneOf:
            - $ref: "#/components/schemas/ReuseOption"
            - type: "null"
        recommendedPath: { $ref: "#/components/schemas/ReusePath" }
        surfaced:
          type: boolean
          description: True when a credible existing option (score >= 60) exists and should be shown

    ReuseEvent:
      type: object
      required: [id, trigger, need, baseSolutionId, caseId, briefId, bestScore, bestTitle, bestSolutionId, bestCapabilityId, pathRecommended, pathTaken, actor, demo, createdAt]
      properties:
        id: { type: string }
        trigger: { $ref: "#/components/schemas/ReuseTrigger" }
        need: { type: string }
        baseSolutionId: { type: ["string", "null"] }
        caseId: { type: ["string", "null"] }
        briefId: { type: ["string", "null"] }
        bestScore: { type: ["number", "null"] }
        bestTitle: { type: ["string", "null"] }
        bestSolutionId: { type: ["string", "null"] }
        bestCapabilityId: { type: ["string", "null"] }
        pathRecommended: { $ref: "#/components/schemas/ReusePath" }
        pathTaken:
          oneOf:
            - $ref: "#/components/schemas/ReusePathTaken"
            - type: "null"
        actor: { type: string }
        demo: { type: boolean, description: Seeded demonstration data, not a real user action }
        createdAt: { type: string }

    ReuseEventUpdate:
      type: object
      required: [pathTaken]
      properties:
        pathTaken: { $ref: "#/components/schemas/ReusePathTaken" }

    Case:
      type: object
      required:
        - id
        - briefId
        - title
        - businessProblemId
        - baseSolutionId
        - candidateSolutionIds
        - status
        - moduleStates
        - configValues
        - experimentId
        - pilotPercent
        - createdByRole
        - saved
        - requirements
        - capabilityRequests
        - parentVersion
        - intent
        - ownerName
        - ownerTeam
        - promotionState
        - demo
        - lineage
        - foldedInto
        - createdAt
        - updatedAt
        - presetInputText
      properties:
        id: { type: string }
        briefId: { type: ["string", "null"] }
        title: { type: string }
        foldedInto: { type: ["string", "null"], description: e.g. Work Order Triage v3.3, once the change is published as a successor version }
        businessProblemId: { type: string }
        baseSolutionId: { type: string, description: The parent product this experiment branches from }
        parentVersion: { type: string, description: Parent product version the experiment branched from }
        intent: { type: ["string", "null"], description: Intent set by the person; null when derived from the change }
        ownerName: { type: string, description: Person who owns this experiment }
        ownerTeam: { type: string }
        promotionState: { $ref: "#/components/schemas/PromotionState" }
        demo: { type: boolean, description: Seeded demo experiment from another persona }
        lineage: { $ref: "#/components/schemas/CaseLineage" }
        candidateSolutionIds:
          type: array
          items: { type: string }
        status: { $ref: "#/components/schemas/CaseStatus" }
        moduleStates:
          type: object
          description: Optional module id -> active
          additionalProperties: { type: boolean }
        configValues:
          type: object
          description: Configurable capability id -> selected option
          additionalProperties: { type: string }
        experimentId: { type: ["string", "null"] }
        pilotPercent: { type: integer, description: Pilot exposure chosen for this case (5, 10 or 20) }
        createdByRole: { $ref: "#/components/schemas/Role" }
        saved: { type: boolean }
        requirements:
          type: array
          description: Requirements added while testing, on top of the brief's list
          items: { $ref: "#/components/schemas/CaseRequirement" }
        capabilityRequests:
          type: array
          description: Capabilities the person asked for that do not exist yet; recorded, never run
          items: { $ref: "#/components/schemas/CapabilityRequest" }
        presetInputText: { type: ["string", "null"], description: Input text the case opened with (a prototype's worked example), if any }
        createdAt: { type: string }
        updatedAt: { type: string }

    CaseRequirement:
      type: object
      required: [id, text, createdAt]
      properties:
        id: { type: string }
        text: { type: string }
        createdAt: { type: string }

    CaseRequirementInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 3 }

    CaseRequirementCoverage:
      type: object
      description: Whether Version A (the current product) already does what the requirement asks
      required: [covered, capabilityId, capabilityName, score]
      properties:
        covered: { type: boolean }
        capabilityId: { type: ["string", "null"] }
        capabilityName: { type: ["string", "null"] }
        score: { type: ["number", "null"] }

    CaseRequirementResult:
      type: object
      required: [case, requirement, coverage, check]
      properties:
        case: { $ref: "#/components/schemas/Case" }
        requirement: { $ref: "#/components/schemas/CaseRequirement" }
        coverage: { $ref: "#/components/schemas/CaseRequirementCoverage" }
        check: { $ref: "#/components/schemas/ReuseCheckResult" }

    CapabilityRequest:
      type: object
      required: [id, need, missing, afterStepId, reuseEventId, createdAt]
      properties:
        id: { type: string }
        need: { type: string, description: What should happen, in the person's words }
        missing: { type: string, description: What the existing approach does not do }
        afterStepId:
          type: ["string", "null"]
          description: Capability id of the step the request was placed after; null for the end of the workflow
        reuseEventId: { type: ["string", "null"] }
        createdAt: { type: string }

    CapabilityRequestInput:
      type: object
      required: [need, missing]
      properties:
        need: { type: string, minLength: 3 }
        missing: { type: string, minLength: 3 }
        afterStepId: { type: string }
        reuseEventId: { type: string }

    CaseInput:
      type: object
      required: [baseSolutionId]
      properties:
        baseSolutionId: { type: string }
        briefId: { type: string }
        title: { type: string }
        intent: { type: string }
        createdByRole: { $ref: "#/components/schemas/Role" }
        moduleIds:
          type: array
          description: Addable modules switched on in Version B from the start (e.g. from a reuse check)
          items: { type: string }
        reuseEventId:
          type: string
          description: Reuse-check event this case acts on; recorded as the path taken
        approvedVersion:
          type: string
          description: Load this approved configuration of the base solution into Version B; Version A stays the standard configuration it was approved on top of
        presetInputText:
          type: string
          description: Input text the case opens with, e.g. a prototype's worked example, so the first run is on that same problem instance

    CaseUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        intent: { type: string, minLength: 1 }
        saved: { type: boolean }
        pilotPercent: { type: integer, enum: [5, 10, 20] }

    ConsolidationSolution:
      type: object
      required: [solution, fate, note, disposition]
      properties:
        solution: { $ref: "#/components/schemas/Solution" }
        fate:
          type: string
          enum: [base, folded, retired]
        note: { type: string, description: One sentence on what happens to this product }
        disposition:
          description: The recorded disposition for this product under this case; null until the owner approves
          oneOf:
            - $ref: "#/components/schemas/Disposition"
            - type: "null"

    DispositionChoice:
      type: object
      required: [solutionId, kind]
      properties:
        solutionId: { type: string }
        kind: { $ref: "#/components/schemas/DispositionKind" }
        reason: { type: string }

    DispositionChoices:
      type: object
      required: [choices]
      properties:
        choices:
          type: array
          items: { $ref: "#/components/schemas/DispositionChoice" }

    MigrationNoteInput:
      type: object
      required: [solutionId, note]
      properties:
        solutionId: { type: string }
        note: { type: string }

    FutureProduct:
      type: object
      required: [name, core, modules, controls]
      properties:
        name: { type: string }
        core: { type: string, description: One line describing the certified core workflow }
        modules:
          type: array
          description: Optional modules carried into the future product
          items:
            type: object
            required: [name, sourceSolutionName]
            properties:
              name: { type: string }
              sourceSolutionName: { type: string }
        controls:
          type: array
          description: Locked controls that stay in place
          items: { type: string }

    DecisionView:
      type: object
      description: One page for a decision-maker. Every field is derived from persisted records; nothing is projected.
      required: [caseId, title, status, businessProblem, overlappingSolutions, recommendedBase, proposedImprovement, evidence, risksAndControls, measuredValue, ownerRecommendation, decisionRequired, decisions, generatedAt]
      properties:
        caseId: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/CaseStatus" }
        businessProblem:
          type: object
          required: [id, title, businessFunction, primaryUser, description]
          properties:
            id: { type: string }
            title: { type: string }
            businessFunction: { $ref: "#/components/schemas/BusinessFunction" }
            primaryUser: { type: string }
            description: { type: string }
        overlappingSolutions:
          type: array
          description: Every live product addressing the problem, the base first
          items:
            type: object
            required: [id, name, status, ownerName, ownerTeam, activeUsers, role, disposition]
            properties:
              id: { type: string }
              name: { type: string }
              status: { $ref: "#/components/schemas/SolutionStatus" }
              ownerName: { type: string }
              ownerTeam: { type: string }
              activeUsers: { type: integer }
              role: { type: string, enum: [base, candidate, other] }
              disposition: { type: ["string", "null"], description: Recorded disposition label, if IT has recorded one }
        recommendedBase:
          type: object
          required: [id, name, status, version, outputType, why]
          properties:
            id: { type: string }
            name: { type: string }
            status: { $ref: "#/components/schemas/SolutionStatus" }
            version: { type: string }
            outputType: { type: string }
            why: { type: string }
        proposedImprovement:
          type: object
          required: [summary, added, removed, changedSettings]
          properties:
            summary: { type: string }
            added:
              type: array
              items:
                type: object
                required: [name, sourceSolutionName, workflowStep]
                properties:
                  name: { type: string }
                  sourceSolutionName: { type: string }
                  workflowStep: { type: string }
            removed:
              type: array
              items: { type: string }
            changedSettings:
              type: array
              items: { $ref: "#/components/schemas/ConfigChange" }
        evidence:
          type: object
          required: [summary, description, latestComparison]
          properties:
            summary: { $ref: "#/components/schemas/EvidenceSummary" }
            description: { type: string }
            latestComparison:
              description: Counts from the newest A/B comparison of the current configuration, if any
              oneOf:
                - type: object
                  required: [inputName, ranAt, added, removed, changed, unchanged, stepsResponsible]
                  properties:
                    inputName: { type: string }
                    ranAt: { type: string }
                    added: { type: integer }
                    removed: { type: integer }
                    changed: { type: integer }
                    unchanged: { type: integer }
                    stepsResponsible:
                      type: array
                      items: { type: string }
                - type: "null"
        risksAndControls:
          type: object
          required: [riskTier, controls, newDependencies, knownGaps, mainRisk]
          properties:
            riskTier: { $ref: "#/components/schemas/EffortLevel" }
            controls:
              type: array
              items: { type: string }
            newDependencies:
              type: array
              items: { type: string }
            knownGaps:
              type: array
              items: { type: string }
            mainRisk: { type: string }
        measuredValue:
          type: object
          description: Only what has been measured. When nothing has, it says so.
          required: [lines, note]
          properties:
            lines:
              type: array
              items: { type: string }
            note: { type: string }
        ownerRecommendation:
          type: object
          required: [recommendation, narrative, confidence]
          properties:
            recommendation:
              oneOf:
                - $ref: "#/components/schemas/ExperimentRecommendation"
                - type: "null"
            narrative: { type: string }
            confidence: { type: ["number", "null"] }
        decisionRequired:
          type: object
          required: [role, label, detail]
          properties:
            role:
              oneOf:
                - $ref: "#/components/schemas/Role"
                - type: "null"
            label: { type: string }
            detail: { type: string }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/Decision" }
        generatedAt: { type: string }

    ConsolidationDecisionView:
      type: object
      required:
        - caseId
        - headline
        - current
        - future
        - outcomes
        - risk
        - evidence
        - availableActions
        - decided
        - successor
      properties:
        caseId: { type: string }
        headline: { type: string, description: e.g. Three solutions can become one governed product. }
        current:
          type: array
          items: { $ref: "#/components/schemas/ConsolidationSolution" }
        future: { $ref: "#/components/schemas/FutureProduct" }
        outcomes:
          type: array
          description: At most four plain-language outcomes
          items: { type: string }
        risk: { type: string, description: The single most important risk }
        evidence:
          type: array
          description: Supporting evidence for the detail drawer
          items: { type: string }
        availableActions:
          type: array
          description: Decision actions currently permitted per role
          items:
            type: object
            required: [role, actions]
            properties:
              role: { $ref: "#/components/schemas/Role" }
              actions:
                type: array
                items: { $ref: "#/components/schemas/DecisionAction" }
        decided:
          type: ["string", "null"]
          description: Summary of the IT consolidation decision, if one exists
        successor:
          description: The successor version on the base product (draft after owner approval, current after IT approval)
          oneOf:
            - $ref: "#/components/schemas/SolutionVersion"
            - type: "null"

    Decision:
      type: object
      required: [id, caseId, role, actor, action, reason, createdAt]
      properties:
        id: { type: string }
        caseId: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        actor: { type: string }
        action: { $ref: "#/components/schemas/DecisionAction" }
        reason: { type: ["string", "null"] }
        createdAt: { type: string }

    DecisionInput:
      type: object
      required: [role, action]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        action: { $ref: "#/components/schemas/DecisionAction" }
        reason: { type: string }

    CaseSummary:
      type: object
      required:
        - case
        - baseSolution
        - businessProblemTitle
        - addedCapabilities
        - experimentRecommendation
        - latestDecision
        - nextStep
      properties:
        case: { $ref: "#/components/schemas/Case" }
        baseSolution: { $ref: "#/components/schemas/Solution" }
        businessProblemTitle: { type: string }
        addedCapabilities:
          type: array
          items: { type: string }
        experimentRecommendation:
          oneOf:
            - $ref: "#/components/schemas/ExperimentRecommendation"
            - type: "null"
        latestDecision:
          oneOf:
            - $ref: "#/components/schemas/Decision"
            - type: "null"
        nextStep: { type: string, description: Plain-language next action for the current state }

    CapabilityProvenance:
      type: object
      required: [capability, sourceSolutionName, reason, evidence, state]
      properties:
        capability: { $ref: "#/components/schemas/Capability" }
        sourceSolutionName: { type: string }
        reason: { type: string }
        evidence: { type: string }
        state: { $ref: "#/components/schemas/FeatureState" }

    RoleSummaries:
      type: object
      required: [seeker, owner, it]
      properties:
        seeker: { type: string }
        owner: { type: string }
        it: { type: string }

    Recommendation:
      type: object
      required:
        - caseId
        - baseSolution
        - overlappingSolutions
        - overallFit
        - summary
        - capabilitiesToAdd
        - capabilitiesToRetain
        - duplicates
        - incompatible
        - retirementCandidates
        - confidence
        - rationale
        - roleSummaries
        - adoptionEffort
      properties:
        caseId: { type: string }
        baseSolution: { $ref: "#/components/schemas/Solution" }
        overlappingSolutions:
          type: array
          items: { $ref: "#/components/schemas/Solution" }
        overallFit: { type: number, description: 0-100 }
        summary: { type: string }
        capabilitiesToAdd:
          type: array
          items: { $ref: "#/components/schemas/CapabilityProvenance" }
        capabilitiesToRetain:
          type: array
          items: { $ref: "#/components/schemas/CapabilityProvenance" }
        duplicates:
          type: array
          items: { $ref: "#/components/schemas/CapabilityProvenance" }
        incompatible:
          type: array
          items: { $ref: "#/components/schemas/CapabilityProvenance" }
        retirementCandidates:
          type: array
          items: { $ref: "#/components/schemas/Solution" }
        confidence: { type: number, description: 0-1 }
        rationale:
          type: array
          items: { type: string }
        roleSummaries: { $ref: "#/components/schemas/RoleSummaries" }
        adoptionEffort: { type: string }

    SampleInput:
      type: object
      required: [id, name, description, solutionIds, text, hasExpected, noteCount]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        solutionIds:
          type: array
          items: { type: string }
        text: { type: string }
        hasExpected: { type: boolean, description: True when labelled expected findings exist for objective scoring }
        noteCount: { type: integer }

    OutputItem:
      type: object
      required: [id, key, kind, text, detail, stepId, refs]
      properties:
        id: { type: string }
        key: { type: string, description: Stable across runs so A and B lines can be matched }
        kind: { type: string }
        text: { type: string }
        detail: { type: ["string", "null"] }
        stepId: { type: string, description: Capability id of the step that produced this line }
        refs:
          type: array
          items: { type: string }

    OutputSection:
      type: object
      required: [key, title, stepId, items]
      properties:
        key: { type: string }
        title: { type: string }
        stepId: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OutputItem" }

    RunOutput:
      type: object
      required: [headline, sections]
      properties:
        headline: { type: string }
        sections:
          type: array
          items: { $ref: "#/components/schemas/OutputSection" }

    StepTrace:
      type: object
      required: [stepId, name, stage, status, inputSummary, transformation, outputSummary, itemCount, durationMs, error]
      properties:
        stepId: { type: string }
        name: { type: string }
        stage: { type: string }
        status:
          type: string
          enum: [ran, skipped, error]
        inputSummary: { type: string }
        transformation: { type: string }
        outputSummary: { type: string }
        itemCount: { type: integer }
        durationMs: { type: integer }
        error: { type: ["string", "null"] }

    RunStats:
      type: object
      required: [steps, sections, items, issues, patterns, actions, errors]
      properties:
        steps: { type: integer }
        sections: { type: integer }
        items: { type: integer }
        issues: { type: integer }
        patterns: { type: integer }
        actions: { type: integer }
        errors: { type: integer }

    Run:
      type: object
      required: [id, caseId, solutionId, version, versionLabel, sampleInputId, inputText, inputHash, enabledCapabilityIds, configValues, configFingerprint, output, trace, stats, durationMs, errors, createdAt]
      properties:
        id: { type: string }
        caseId: { type: ["string", "null"] }
        solutionId: { type: string }
        version:
          type: string
          enum: [A, B]
        versionLabel: { type: string }
        sampleInputId: { type: ["string", "null"] }
        inputText: { type: string }
        inputHash: { type: string }
        enabledCapabilityIds:
          type: array
          items: { type: string }
        configValues:
          type: object
          additionalProperties: { type: string }
        configFingerprint: { type: string, description: Server-computed fingerprint of the exact configuration that ran (sorted capability ids and versions, settings, catalog version) }
        output: { $ref: "#/components/schemas/RunOutput" }
        trace:
          type: array
          items: { $ref: "#/components/schemas/StepTrace" }
        stats: { $ref: "#/components/schemas/RunStats" }
        durationMs: { type: integer }
        errors:
          type: array
          items: { type: string }
        createdAt: { type: string }

    RunRequest:
      type: object
      required: [version]
      properties:
        solutionId: { type: string, description: Run the production workflow of a solution (version A) }
        caseId: { type: string, description: Run a case; version A is the base product, version B the proposed configuration }
        version:
          type: string
          enum: [A, B]
        sampleInputId: { type: string }
        inputText: { type: string, description: Overrides the sample text; used as-is when no sample is given }

    WorkflowBlock:
      type: object
      required: [capability, stage, kind, active, executable, value, options, origin, blockedReason]
      properties:
        capability: { $ref: "#/components/schemas/Capability" }
        stage: { type: string }
        kind:
          type: string
          enum: [required, configurable, optional]
        active: { type: boolean }
        executable: { type: boolean, description: False for controls (identity, audit) that do not transform the input }
        value: { type: ["string", "null"] }
        options:
          type: ["array", "null"]
          items: { type: string }
        origin:
          type: string
          enum: [base, added]
        blockedReason: { type: ["string", "null"] }

    SolutionWorkbench:
      type: object
      required: [solution, liveVersion, blocks, controls, sampleInputs, exampleRun]
      properties:
        solution: { $ref: "#/components/schemas/Solution" }
        liveVersion: { type: string, description: The product's current governed version; differs from solution.currentVersion when this workbench shows an earlier (standard) version }
        blocks:
          type: array
          description: Executable steps in execution order
          items: { $ref: "#/components/schemas/WorkflowBlock" }
        controls:
          type: array
          description: Locked controls preserved around the workflow
          items: { $ref: "#/components/schemas/Capability" }
        sampleInputs:
          type: array
          items: { $ref: "#/components/schemas/SampleInput" }
        exampleRun: { $ref: "#/components/schemas/Run" }

    DiffEntry:
      type: object
      required: [change, sectionKey, sectionTitle, stepId, stepName, sourceSolutionName, workflowStep, addedModule, before, after, itemKey, kind]
      properties:
        change:
          type: string
          enum: [added, removed, changed]
        sectionKey: { type: string }
        sectionTitle: { type: string }
        stepId: { type: string }
        stepName: { type: string }
        sourceSolutionName: { type: string }
        workflowStep: { type: string, description: Workflow stage the responsible step belongs to }
        addedModule: { type: boolean, description: True when the responsible step was added to Version B from another product }
        before: { type: ["string", "null"] }
        after: { type: ["string", "null"] }
        itemKey: { type: string }
        kind: { type: string }

    OutputDiff:
      type: object
      required: [entries, added, removed, changed, unchanged, stepsResponsible]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/DiffEntry" }
        added: { type: integer }
        removed: { type: integer }
        changed: { type: integer }
        unchanged: { type: integer }
        stepsResponsible:
          type: array
          items:
            type: object
            required: [stepId, name, sourceSolutionName, workflowStep, addedModule, changes]
            properties:
              stepId: { type: string }
              name: { type: string }
              sourceSolutionName: { type: string }
              workflowStep: { type: string }
              addedModule: { type: boolean }
              changes: { type: integer }

    ObjectiveScore:
      type: object
      required: [expected, identified, missed, falsePositives, precision, recall, identifiedLabels, missedLabels, falsePositiveLabels]
      properties:
        expected: { type: integer }
        identified: { type: integer }
        missed: { type: integer }
        falsePositives: { type: integer }
        precision: { type: ["number", "null"] }
        recall: { type: ["number", "null"] }
        identifiedLabels:
          type: array
          items: { type: string }
        missedLabels:
          type: array
          items: { type: string }
        falsePositiveLabels:
          type: array
          items: { type: string }

    ABComparison:
      type: object
      required: [caseId, sampleInputId, inputText, inputHash, runA, runB, diff, scoreA, scoreB, explanation, evaluation, staleB]
      properties:
        caseId: { type: string }
        staleB: { type: boolean, description: True when Version B has changed since this run; rerun to refresh }
        sampleInputId: { type: ["string", "null"] }
        inputText: { type: string }
        inputHash: { type: string }
        runA: { $ref: "#/components/schemas/Run" }
        runB: { $ref: "#/components/schemas/Run" }
        diff: { $ref: "#/components/schemas/OutputDiff" }
        scoreA:
          oneOf:
            - $ref: "#/components/schemas/ObjectiveScore"
            - type: "null"
        scoreB:
          oneOf:
            - $ref: "#/components/schemas/ObjectiveScore"
            - type: "null"
        explanation:
          type: array
          description: Plain-language lines explaining what changed and which step caused it
          items: { type: string }
        evaluation:
          oneOf:
            - $ref: "#/components/schemas/Evaluation"
            - type: "null"
          description: The current user's recorded preference for this exact pair, if any

    CompareRequest:
      type: object
      properties:
        sampleInputId: { type: string }
        inputText: { type: string }

    Evaluation:
      type: object
      required: [id, caseId, sessionId, sampleInputId, inputHash, runAId, runBId, fingerprintA, fingerprintB, choice, reason, rating, evaluator, role, blind, demo, createdAt]
      properties:
        id: { type: string }
        caseId: { type: string }
        sessionId: { type: ["string", "null"] }
        sampleInputId: { type: ["string", "null"] }
        inputHash: { type: string }
        runAId: { type: string }
        runBId: { type: string }
        fingerprintA: { type: string, description: Configuration fingerprint of run A when the vote was recorded }
        fingerprintB: { type: string, description: Configuration fingerprint of run B when the vote was recorded }
        choice:
          type: string
          enum: [A, B, neither]
        reason: { type: ["string", "null"] }
        rating: { type: ["integer", "null"] }
        evaluator: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        blind: { type: boolean }
        demo: { type: boolean, description: True for simulated demo accounts }
        createdAt: { type: string }

    EvaluationInput:
      type: object
      required: [runAId, runBId, choice, role, evaluator]
      properties:
        runAId: { type: string }
        runBId: { type: string }
        choice:
          type: string
          enum: [A, B, neither]
        reason: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        role: { $ref: "#/components/schemas/Role" }
        evaluator: { type: string }

    EvaluationSummary:
      type: object
      required: [tests, aPreferred, bPreferred, neither, averageRating, distinctInputs, blindVotes, demoVotes]
      properties:
        tests: { type: integer, description: Recorded evaluations; computed only from stored votes }
        aPreferred: { type: integer }
        bPreferred: { type: integer }
        neither: { type: integer }
        averageRating: { type: ["number", "null"] }
        distinctInputs: { type: integer }
        blindVotes: { type: integer }
        demoVotes: { type: integer }

    EvaluationList:
      type: object
      required: [summary, items, currentFingerprint, setAside]
      properties:
        summary: { $ref: "#/components/schemas/EvaluationSummary", description: Votes recorded against the case's current Version B configuration only }
        items:
          type: array
          description: Votes for the current configuration
          items: { $ref: "#/components/schemas/Evaluation" }
        currentFingerprint: { type: string, description: Fingerprint of the case's current Version B }
        setAside: { type: integer, description: Votes recorded against earlier Version B configurations; reported, never merged }

    TestSessionInput:
      type: object
      required: [createdBy]
      properties:
        createdBy: { type: string }
        title: { type: string }

    TestPair:
      type: object
      required: [sampleInputId, inputName, inputText, left, right, responses, expired]
      properties:
        sampleInputId: { type: string }
        inputName: { type: string }
        inputText: { type: string }
        left: { $ref: "#/components/schemas/RunOutput" }
        right: { $ref: "#/components/schemas/RunOutput" }
        responses: { type: integer }
        expired: { type: boolean, description: True when Version B changed after these runs; the pair no longer accepts responses }

    TestSession:
      type: object
      required: [id, caseId, createdBy, title, closed, pairs, responseCount, results, setAside, createdAt]
      properties:
        id: { type: string }
        caseId: { type: string }
        createdBy: { type: string }
        title: { type: string }
        closed: { type: boolean }
        pairs:
          type: array
          items: { $ref: "#/components/schemas/TestPair" }
        responseCount: { type: integer, description: Responses recorded against the case's current Version B configuration }
        results:
          oneOf:
            - $ref: "#/components/schemas/EvaluationSummary"
            - type: "null"
          description: Aggregate preference for the current configuration, revealed only once responses exist
        setAside: { type: integer, description: Responses recorded against earlier configurations; reported, never merged }
        createdAt: { type: string }

    TestResponseInput:
      type: object
      required: [sampleInputId, pick, tester]
      properties:
        sampleInputId: { type: string }
        pick:
          type: string
          enum: [left, right, neither]
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        tester: { type: string }
        demo: { type: boolean, description: Mark as a simulated demo account vote }

    SearchResult:
      type: object
      required: [solution, score, reasons, matchedCapabilities, familyRole, familyTitle]
      properties:
        solution: { $ref: "#/components/schemas/Solution" }
        score: { type: number }
        familyRole: { $ref: "#/components/schemas/FamilyRole" }
        familyTitle: { type: string, description: The business problem this product belongs to }
        reasons:
          type: array
          items: { type: string }
        matchedCapabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }

    SearchResults:
      type: object
      required: [query, results, capabilities, source]
      properties:
        query: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        capabilities:
          type: array
          description: Reusable capabilities matching the query on their own, each with its source family
          items: { $ref: "#/components/schemas/FamilyCapability" }
        source:
          type: string
          enum: [keyword, hybrid]

    FamilyRole:
      type: string
      enum: [preferred, alternative, consolidating]
      description: preferred = the product to use for its business problem; alternative = another live product without a disposition; consolidating = a product IT has given a disposition

    FamilyCapability:
      type: object
      description: A capability that can be reused across products, with where it comes from and where it is already used
      required: [capability, familyId, familyTitle, sourceSolutionId, sourceSolutionName, usedIn, includedInPreferred, tryIn]
      properties:
        capability: { $ref: "#/components/schemas/Capability" }
        familyId: { type: string, description: Business problem of the capability's source product }
        familyTitle: { type: string }
        sourceSolutionId: { type: string }
        sourceSolutionName: { type: string }
        usedIn:
          type: array
          description: Products whose current configuration includes this capability
          items:
            type: object
            required: [solutionId, solutionName, version]
            properties:
              solutionId: { type: string }
              solutionName: { type: string }
              version: { type: string }
        includedInPreferred: { type: boolean, description: Already part of the preferred product of the family card it is shown on }
        tryIn:
          description: The preferred product a new case would add this capability to (Version B); null when nothing can take it
          oneOf:
            - type: object
              required: [solutionId, solutionName]
              properties:
                solutionId: { type: string }
                solutionName: { type: string }
            - type: "null"

    ApprovedConfiguration:
      type: object
      description: A published configuration of the preferred product - what IT approved on top of the standard setup
      required: [solutionId, version, baseVersion, title, changes, summary, releasedAt, caseId]
      properties:
        solutionId: { type: string }
        version: { type: string }
        baseVersion: { type: string, description: The standard configuration this one is compared against }
        title: { type: string, description: Short name made from what changed, e.g. Safety Signals + Immediate notifications }
        changes:
          type: array
          items: { type: string }
        summary: { type: string }
        releasedAt: { type: string }
        caseId: { type: ["string", "null"] }

    SolutionFamily:
      type: object
      required: [businessProblem, preferred, support, covers, approvedConfigurations, reusableCapabilities, alternatives, consolidating]
      properties:
        businessProblem: { $ref: "#/components/schemas/BusinessProblem" }
        preferred: { $ref: "#/components/schemas/Solution" }
        support: { type: string, description: Plain-language support status of the preferred product }
        covers:
          type: array
          description: What the preferred product's production configuration does, one entry per active capability
          items:
            type: object
            required: [capabilityId, name, workflowStep]
            properties:
              capabilityId: { type: string }
              name: { type: string }
              workflowStep: { type: string }
        approvedConfigurations:
          type: array
          items: { $ref: "#/components/schemas/ApprovedConfiguration" }
        reusableCapabilities:
          type: array
          items: { $ref: "#/components/schemas/FamilyCapability" }
        alternatives:
          type: array
          description: Other live products for the problem without a disposition
          items: { $ref: "#/components/schemas/Solution" }
        consolidating:
          type: array
          description: Products IT has given a disposition; shown as being consolidated, never as alternatives
          items: { $ref: "#/components/schemas/Solution" }

    ConfigurationPreview:
      type: object
      description: Two real engine runs of the same sample input - standard configuration and the approved one - with the lines that differ
      required: [solutionId, version, baseVersion, sampleInput, standard, variant, diff, explanation, catalogVersion]
      properties:
        solutionId: { type: string }
        version: { type: string }
        baseVersion: { type: string }
        sampleInput: { $ref: "#/components/schemas/SampleInput" }
        standard: { $ref: "#/components/schemas/Run" }
        variant: { $ref: "#/components/schemas/Run" }
        diff: { $ref: "#/components/schemas/OutputDiff" }
        explanation:
          type: array
          items: { type: string }
        catalogVersion: { type: string }

    OwnedSolution:
      type: object
      required: [solution, proposals, groups, experimentsInProgress, openTests, evaluations, evaluationsSetAside, recentRuns]
      properties:
        solution: { $ref: "#/components/schemas/Solution" }
        proposals:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        groups:
          type: array
          description: Saved or proposed experiments on this product, grouped by intent
          items: { $ref: "#/components/schemas/ImprovementGroup" }
        experimentsInProgress: { type: integer }
        openTests: { type: integer, description: Cases with runs but no owner decision yet }
        evaluations: { type: integer, description: Recorded preference votes across proposals, current configurations only }
        evaluationsSetAside: { type: integer, description: Votes recorded against earlier configurations of those proposals }
        recentRuns: { type: integer, description: Runs recorded in the last 30 days }

    ComponentConfig:
      type: object
      required: [capability, controlType, state, active, executable, value, options, recommended, blockedReason, sourceSolutionName]
      properties:
        capability: { $ref: "#/components/schemas/Capability" }
        controlType: { $ref: "#/components/schemas/ControlType" }
        executable: { type: boolean, description: True when the capability is a workflow step that transforms the input; false for controls }
        state: { $ref: "#/components/schemas/FeatureState" }
        active: { type: boolean }
        value: { type: ["string", "null"] }
        options:
          type: ["array", "null"]
          items: { type: string }
        recommended: { type: boolean }
        blockedReason: { type: ["string", "null"] }
        sourceSolutionName: { type: string }

    WorkflowStepConfig:
      type: object
      required: [name, components]
      properties:
        name: { type: string }
        components:
          type: array
          items: { $ref: "#/components/schemas/ComponentConfig" }

    ImpactDimension:
      type: object
      required: [score, label, note]
      properties:
        score: { type: number, description: 0-100 }
        label: { type: string }
        note: { type: string }

    Impact:
      type: object
      required: [userValue, effort, risk, compatibility, evidenceConfidence, projected]
      properties:
        userValue: { $ref: "#/components/schemas/ImpactDimension" }
        effort: { $ref: "#/components/schemas/ImpactDimension" }
        risk: { $ref: "#/components/schemas/ImpactDimension" }
        compatibility: { $ref: "#/components/schemas/ImpactDimension" }
        evidenceConfidence: { $ref: "#/components/schemas/ImpactDimension" }
        projected:
          $ref: "#/components/schemas/Metrics"
          description: Projected metrics with the current configuration applied

    Configuration:
      type: object
      required: [caseId, summary, steps, impact, activeModuleCount, lockedCount, recommended, isRecommended]
      properties:
        caseId: { type: string }
        summary: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStepConfig" }
        impact: { $ref: "#/components/schemas/Impact" }
        activeModuleCount: { type: integer }
        lockedCount: { type: integer }
        recommended:
          $ref: "#/components/schemas/ConfigurationUpdate"
          description: The recommended module states and settings; send it back to reset the case
        isRecommended: { type: boolean, description: True when the current configuration equals the recommended one }

    ConfigurationUpdate:
      type: object
      properties:
        moduleStates:
          type: object
          additionalProperties: { type: boolean }
        configValues:
          type: object
          additionalProperties: { type: string }

    SyntheticPersona:
      type: object
      required: [id, name, description, experience, volume, dataQuality, changeTolerance, processComplexity]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        experience: { type: number, description: 0-1 }
        volume: { type: number, description: 0-1 }
        dataQuality: { type: number, description: 0-1 }
        changeTolerance: { type: number, description: 0-1 }
        processComplexity: { type: number, description: 0-1 }

    ExperimentPlan:
      type: object
      required: [caseId, baselineName, challengerName, metrics, cohort, recommendedSample, durationWeeks, keyRisks, summary]
      properties:
        caseId: { type: string }
        baselineName: { type: string }
        challengerName: { type: string }
        metrics:
          type: array
          items: { type: string }
        cohort:
          type: array
          items: { $ref: "#/components/schemas/SyntheticPersona" }
        recommendedSample: { type: integer }
        durationWeeks: { type: integer }
        keyRisks:
          type: array
          items: { type: string }
        summary: { type: string }

    ExperimentMetric:
      type: object
      required: [key, label, unit, baseline, proposed, deltaPct, betterWhen, primary, improved]
      properties:
        key: { type: string }
        label: { type: string }
        unit: { type: string }
        baseline: { type: number }
        proposed: { type: number }
        deltaPct: { type: number }
        betterWhen:
          type: string
          enum: [lower, higher]
        primary: { type: boolean }
        improved: { type: boolean }

    SegmentResult:
      type: object
      required: [persona, baselineTaskMinutes, proposedTaskMinutes, baselineSuccessRate, proposedSuccessRate, deltaPct, flag]
      properties:
        persona: { $ref: "#/components/schemas/SyntheticPersona" }
        baselineTaskMinutes: { type: number }
        proposedTaskMinutes: { type: number }
        baselineSuccessRate: { type: number }
        proposedSuccessRate: { type: number }
        deltaPct: { type: number, description: Task-time change, negative is faster }
        flag: { type: ["string", "null"], description: Risk note for weak-performing segments }

    Experiment:
      type: object
      required:
        - id
        - caseId
        - label
        - baselineName
        - challengerName
        - seed
        - cohort
        - metrics
        - segments
        - risks
        - confidence
        - recommendation
        - narrative
        - createdAt
      properties:
        id: { type: string }
        caseId: { type: string }
        label:
          type: string
          description: Always a visible simulated-result disclaimer
        baselineName: { type: string }
        challengerName: { type: string }
        seed: { type: integer }
        cohort:
          type: array
          items: { $ref: "#/components/schemas/SyntheticPersona" }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/ExperimentMetric" }
        segments:
          type: array
          items: { $ref: "#/components/schemas/SegmentResult" }
        risks:
          type: array
          items: { type: string }
        confidence: { type: number, description: 0-1 }
        recommendation: { $ref: "#/components/schemas/ExperimentRecommendation" }
        narrative: { type: string }
        createdAt: { type: string }

    VersionSnapshot:
      type: object
      required: [version, label, workflowSteps, capabilities, userGroups, performance]
      properties:
        version: { type: string }
        label: { type: string }
        workflowSteps:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        userGroups:
          type: array
          items: { type: string }
        performance:
          description: Measured production metrics; null for a proposed version that has not run in production
          oneOf:
            - $ref: "#/components/schemas/Metrics"
            - type: "null"

    ConfigChange:
      type: object
      required: [capabilityName, from, to]
      properties:
        capabilityName: { type: string }
        from: { type: string }
        to: { type: string }

    AffectedGroup:
      type: object
      required: [group, users, impact]
      properties:
        group: { type: string }
        users: { type: integer }
        impact: { type: string }

    PilotPlan:
      type: object
      required:
        - eligibleGroup
        - pilotPercent
        - pilotUsers
        - durationWeeks
        - successThresholds
        - guardrails
        - monitoring
        - rollbackTrigger
        - ownerApprovalRequired
        - itApprovalRequired
      properties:
        eligibleGroup: { type: string }
        pilotPercent: { type: integer }
        pilotUsers: { type: integer }
        durationWeeks: { type: integer }
        successThresholds:
          type: array
          items: { type: string }
        guardrails:
          type: array
          items: { type: string }
        monitoring:
          type: array
          items: { type: string }
        rollbackTrigger: { type: string }
        ownerApprovalRequired: { type: boolean }
        itApprovalRequired: { type: boolean }

    ChangeReview:
      type: object
      required:
        - case
        - baseSolution
        - currentVersion
        - proposedVersion
        - added
        - removed
        - changedConfig
        - unchanged
        - affectedUsers
        - newDependencies
        - experiment
        - pilotPlan
        - ownerSummary
        - decisions
        - availableActions
        - evidence
        - promotionGate
      properties:
        case: { $ref: "#/components/schemas/Case" }
        evidence: { $ref: "#/components/schemas/EvidenceSummary" }
        promotionGate:
          type: array
          description: The production-promotion checklist with live values; unmet items are shown, never hidden
          items: { $ref: "#/components/schemas/GateItem" }
        baseSolution: { $ref: "#/components/schemas/Solution" }
        currentVersion: { $ref: "#/components/schemas/VersionSnapshot" }
        proposedVersion: { $ref: "#/components/schemas/VersionSnapshot" }
        added:
          type: array
          items: { $ref: "#/components/schemas/CapabilityProvenance" }
        removed:
          type: array
          items: { $ref: "#/components/schemas/CapabilityProvenance" }
        changedConfig:
          type: array
          items: { $ref: "#/components/schemas/ConfigChange" }
        unchanged:
          type: array
          items: { type: string }
        affectedUsers:
          type: array
          items: { $ref: "#/components/schemas/AffectedGroup" }
        newDependencies:
          type: array
          items: { type: string }
        experiment:
          oneOf:
            - $ref: "#/components/schemas/Experiment"
            - type: "null"
        pilotPlan: { $ref: "#/components/schemas/PilotPlan" }
        ownerSummary: { type: string }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/Decision" }
        availableActions:
          type: array
          description: Decision actions currently permitted per role
          items:
            type: object
            required: [role, actions]
            properties:
              role: { $ref: "#/components/schemas/Role" }
              actions:
                type: array
                items: { $ref: "#/components/schemas/DecisionAction" }

    EvidenceSummary:
      type: object
      description: Evidence for the case's current Version B configuration, plus what was set aside
      required: [currentFingerprint, inputsTested, runtimeA, runtimeB, labelled, votes, setAside]
      properties:
        currentFingerprint: { type: string }
        inputsTested: { type: integer, description: Distinct inputs on which the current configuration ran against the baseline }
        runtimeA: { type: ["integer", "null"] }
        runtimeB: { type: ["integer", "null"] }
        labelled:
          oneOf:
            - type: object
              required: [inputs, recallA, recallB, precisionA, precisionB]
              properties:
                inputs: { type: integer }
                recallA: { type: number }
                recallB: { type: number }
                precisionA: { type: number }
                precisionB: { type: number }
            - type: "null"
        votes:
          oneOf:
            - $ref: "#/components/schemas/EvaluationSummary"
            - type: "null"
        setAside: { type: integer, description: Votes from earlier configurations, reported separately }

    GateItem:
      type: object
      required: [key, label, met, value]
      properties:
        key: { type: string }
        label: { type: string }
        met: { type: boolean }
        value: { type: string, description: The real value behind the check }

    PortfolioMetric:
      type: object
      required: [key, question, label, value, numerator, denominator, definition, demo]
      properties:
        key: { type: string }
        question: { type: string, description: The IT leader's question this metric answers }
        label: { type: string }
        value: { type: string, description: Plain reading of the metric, or "No data yet" when nothing has been recorded }
        numerator: { type: ["number", "null"] }
        denominator: { type: ["number", "null"] }
        definition: { type: string, description: What is counted in the numerator and the denominator }
        demo: { type: boolean, description: True when the number includes seeded demonstration data }

    PortfolioMetrics:
      type: object
      required: [reuseBeforeBuild, capabilityAcceptance, improvementsFolded, variantsPerFamily, duplicateAfterBuild, timeToFirstTest]
      properties:
        reuseBeforeBuild: { $ref: "#/components/schemas/PortfolioMetric" }
        capabilityAcceptance: { $ref: "#/components/schemas/PortfolioMetric" }
        improvementsFolded: { $ref: "#/components/schemas/PortfolioMetric" }
        variantsPerFamily: { $ref: "#/components/schemas/PortfolioMetric" }
        duplicateAfterBuild: { $ref: "#/components/schemas/PortfolioMetric" }
        timeToFirstTest: { $ref: "#/components/schemas/PortfolioMetric" }

    QueueItemKind:
      type: string
      enum: [consolidation_approval, unowned_product, migration_pending, new_family_request, registered_prototype]

    QueueItem:
      type: object
      required: [id, kind, title, detail, usage, actionLabel, caseId, solutionId, demo]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/QueueItemKind" }
        title: { type: string }
        detail: { type: string, description: Why IT is needed, in one sentence; includes the requester's reason for a new-family request }
        usage: { type: ["string", "null"], description: Usage context such as "120 users"; never decides the recommendation }
        actionLabel: { type: string, description: The one primary action for this row }
        caseId: { type: ["string", "null"], description: The consolidation case the action opens, if any }
        solutionId: { type: ["string", "null"] }
        demo: { type: boolean }

    RedirectEvent:
      type: object
      required: [id, actor, need, outcome, at, demo]
      properties:
        id: { type: string }
        actor: { type: string }
        need: { type: string }
        outcome: { type: string, description: e.g. tried Safety Signals instead of building }
        at: { type: string }
        demo: { type: boolean }

    Portfolio:
      type: object
      required: [headline, valueStatement, metrics, queue, redirects]
      properties:
        headline: { type: string }
        valueStatement: { type: string }
        metrics: { $ref: "#/components/schemas/PortfolioMetrics" }
        queue:
          type: array
          description: Only items that need IT intervention; routine experiments never appear
          items: { $ref: "#/components/schemas/QueueItem" }
        redirects:
          type: array
          description: Recent reuse checks where a person used or improved an existing capability instead of building
          items: { $ref: "#/components/schemas/RedirectEvent" }

    SeekerOverview:
      type: object
      required: [headline, recentBriefs, recommendedSolutions, savedCases, demoPrompt]
      properties:
        headline: { type: string }
        recentBriefs:
          type: array
          items: { $ref: "#/components/schemas/Brief" }
        recommendedSolutions:
          type: array
          items: { $ref: "#/components/schemas/Solution" }
        savedCases:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        demoPrompt:
          type: string
          description: The pre-seeded demonstration pain point, usable as a one-click example

    OwnerSolution:
      type: object
      required: [solution, pendingChanges, openExperiments, sharedCapabilityCount, proposedDecision]
      properties:
        solution: { $ref: "#/components/schemas/Solution" }
        pendingChanges: { type: integer }
        openExperiments: { type: integer }
        sharedCapabilityCount: { type: integer }
        proposedDecision: { type: ["string", "null"] }

    OwnerOverview:
      type: object
      required: [headline, ownerName, mySolutions, proposedChanges, pendingExperiments, versionsRequiringReview]
      properties:
        headline: { type: string }
        ownerName: { type: string }
        mySolutions:
          type: array
          items: { $ref: "#/components/schemas/OwnerSolution" }
        proposedChanges:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }
        pendingExperiments:
          type: array
          items: { $ref: "#/components/schemas/Experiment" }
        versionsRequiringReview:
          type: array
          items: { $ref: "#/components/schemas/CaseSummary" }

    DemoState:
      type: object
      required: [ok, demoBriefId, demoCaseId, demoPrompt, aiAvailable]
      properties:
        ok: { type: boolean }
        demoBriefId: { type: string }
        demoCaseId: { type: string }
        demoPrompt: { type: string }
        aiAvailable: { type: boolean }

    # ---------- Prototype intake ("I have a prototype") ----------

    PrototypePlatformKind:
      type: string
      enum: [platform, saas, agent_framework, notebook, other]
      description: Where the prototype runs today; platform = low-code platform such as Copilot Studio or Power Platform

    PrototypeOrigin:
      type: object
      description: Set on registered prototypes only; the platform the prototype runs on outside FUSEBOX
      required: [platformKind, platformName, link, registeredAt]
      properties:
        platformKind: { $ref: "#/components/schemas/PrototypePlatformKind" }
        platformName: { type: string }
        link: { type: ["string", "null"] }
        registeredAt: { type: string }

    PrototypeExampleInput:
      type: object
      required: [input, output]
      properties:
        input: { type: string, minLength: 10, description: The problem instance fed to the prototype (pasted text or a library sample input) }
        output: { type: string, minLength: 10, description: The output the prototype produced for it, pasted as text }
        sampleInputId: { type: string, description: Set when the input is one of the library's sample inputs }

    PrototypeExample:
      type: object
      required: [id, input, output, sampleInputId]
      properties:
        id: { type: string }
        input: { type: string }
        output: { type: string }
        sampleInputId: { type: ["string", "null"] }

    PrototypeVerdict:
      type: string
      enum: [duplicates, extends, new]
      description: duplicates = an existing capability already produces this; extends = an existing product ran the same input and did not produce it; new = nothing in the library is about it

    PrototypeComponentInput:
      type: object
      required: [name]
      properties:
        id: { type: string }
        name: { type: string, minLength: 2 }
        description: { type: string }
        sectionTitles:
          type: array
          items: { type: string }

    PrototypeComponent:
      type: object
      required: [id, name, description, sectionTitles, matchedCapabilityId, matchedCapabilityName, matchedSolutionId, matchedSolutionName, matchScore, verdict, reason]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        sectionTitles:
          type: array
          description: Titles of the example sections that support this component
          items: { type: string }
        matchedCapabilityId: { type: ["string", "null"] }
        matchedCapabilityName: { type: ["string", "null"], description: Null means nothing in the library produces this }
        matchedSolutionId: { type: ["string", "null"] }
        matchedSolutionName: { type: ["string", "null"] }
        matchScore: { type: ["number", "null"], description: Reuse-fit score of the matched capability (0-100) }
        verdict: { $ref: "#/components/schemas/PrototypeVerdict" }
        reason: { type: string }

    PrototypeIntake:
      type: object
      required: [name, platformKind, platformName, users, description, examples]
      properties:
        name: { type: string, minLength: 2 }
        platformKind: { $ref: "#/components/schemas/PrototypePlatformKind" }
        platformName: { type: string, minLength: 2 }
        link: { type: string }
        users: { type: string, minLength: 2, description: Who uses it today }
        ownerName: { type: string }
        ownerTeam: { type: string }
        description: { type: string, minLength: 10, description: One sentence on what it does }
        dataInvolved:
          type: array
          items: { type: string }
        riskTier: { $ref: "#/components/schemas/EffortLevel" }
        noRestrictedData: { type: boolean, description: The person confirms the examples contain no restricted data }
        createdByRole: { $ref: "#/components/schemas/Role" }
        examples:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/PrototypeExampleInput" }
        components:
          type: array
          description: The confirmed component list; when omitted the server proposes one from the examples
          items: { $ref: "#/components/schemas/PrototypeComponentInput" }

    PrototypeComparisonLine:
      type: object
      required: [key, section, text, status, matchedText, matchedStepId, matchedStepName, componentId]
      properties:
        key: { type: string }
        section: { type: string, description: Section of the submitted output the line came from }
        text: { type: string }
        status:
          type: string
          enum: [reproduced, not_produced]
          description: reproduced = the existing product produced an equivalent line on the same input; not_produced = it did not
        matchedText: { type: ["string", "null"] }
        matchedStepId: { type: ["string", "null"] }
        matchedStepName: { type: ["string", "null"] }
        componentId: { type: ["string", "null"], description: The component that explains a line the existing product did not produce }

    PrototypeComparison:
      type: object
      description: Same problem, two outputs. The submitted side is a claim; the real side is an actual run of the existing product on exactly that input.
      required: [exampleId, solutionId, solutionName, submittedLabel, realLabel, lines, reproduced, notProduced, onlyInReal, run]
      properties:
        exampleId: { type: string }
        solutionId: { type: string }
        solutionName: { type: string }
        submittedLabel: { type: string }
        realLabel: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PrototypeComparisonLine" }
        reproduced: { type: integer }
        notProduced: { type: integer }
        onlyInReal: { type: integer, description: Lines the existing product produced that the submitted output does not contain }
        run: { $ref: "#/components/schemas/Run" }

    PrototypeRecommendedPath:
      type: string
      enum: [fold_into, connect_module, register_new]

    PrototypeAnalysis:
      type: object
      required: [components, comparison, fallback, recommendedPath, recommendation, basis, targetSolutionId, targetSolutionName, targetLive, targetCapabilityId]
      properties:
        components:
          type: array
          items: { $ref: "#/components/schemas/PrototypeComponent" }
        comparison:
          oneOf:
            - $ref: "#/components/schemas/PrototypeComparison"
            - type: "null"
        fallback: { type: ["string", "null"], description: Set when no live product can run any example input }
        recommendedPath: { $ref: "#/components/schemas/PrototypeRecommendedPath" }
        recommendation: { type: string, description: One sentence, mirroring the reuse check's single recommended path }
        basis: { type: string, description: What the verdicts are based on }
        targetSolutionId: { type: ["string", "null"] }
        targetSolutionName: { type: ["string", "null"] }
        targetLive: { type: boolean, description: True when the target product runs in FUSEBOX, so a case can open on it }
        targetCapabilityId: { type: ["string", "null"] }

    RegisteredPrototype:
      type: object
      required: [id, name, platformKind, platformName, link, users, ownerName, ownerTeam, description, dataInvolved, riskTier, examples, components, recommendedPath, recommendation, comparedSolutionId, comparedSolutionName, reuseEventId, createdBy, createdByRole, createdAt, removed]
      properties:
        id: { type: string, description: Also the catalogue solution id }
        name: { type: string }
        platformKind: { $ref: "#/components/schemas/PrototypePlatformKind" }
        platformName: { type: string }
        link: { type: ["string", "null"] }
        users: { type: string }
        ownerName: { type: string }
        ownerTeam: { type: string }
        description: { type: string }
        dataInvolved:
          type: array
          items: { type: string }
        riskTier: { $ref: "#/components/schemas/EffortLevel" }
        examples:
          type: array
          items: { $ref: "#/components/schemas/PrototypeExample" }
        components:
          type: array
          items: { $ref: "#/components/schemas/PrototypeComponent" }
        recommendedPath: { $ref: "#/components/schemas/PrototypeRecommendedPath" }
        recommendation: { type: string }
        comparedSolutionId: { type: ["string", "null"], description: The product whose capabilities this prototype duplicates or extends, or that ran its example }
        comparedSolutionName: { type: ["string", "null"] }
        reuseEventId: { type: ["string", "null"] }
        createdBy: { type: string }
        createdByRole: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string }
        removed: { type: boolean }

    PrototypeDetail:
      type: object
      required: [prototype, solution, analysis]
      properties:
        prototype: { $ref: "#/components/schemas/RegisteredPrototype" }
        solution: { $ref: "#/components/schemas/Solution" }
        analysis: { $ref: "#/components/schemas/PrototypeAnalysis" }
